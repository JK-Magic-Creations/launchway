# Argo Rollouts points each Service at the right pods while a canary runs.
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  selector: { app.kubernetes.io/name: shop }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: shop-canary
spec:
  selector: { app.kubernetes.io/name: shop }
  ports:
    - { name: http, port: 80, targetPort: http }
