kind: Namespace
metadata:
  name: shop
  labels: { pod-security.kubernetes.io/enforce: restricted }
---
apiVersion: v1
kind: Namespace
metadata:
  name: launchway-steps
  labels: { pod-security.kubernetes.io/enforce: restricted }
