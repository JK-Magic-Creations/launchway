# A configuration for trying Launchway on your own machine.
# Paths are relative to this file.
listen: 127.0.0.1:8080
data: ../launchway-data

projects:
  # A small repository made by `make demo`, to play with freely.
  - name: demo-app
    repo: ../../launchway-demo
    branch: main
    poll: 5s
    # The pipeline editor may save to the demo, on new branches.
    push: { branch_prefix: launchway/ }

  # An app whose pipeline uses templates from the demo library, made by
  # `make demo`.
  - name: demo-lib-app
    repo: ../../launchway-demo-lib-app
    branch: main
    poll: 5s
    push: { branch_prefix: launchway/ }

  # A repository with no pipeline file: the server gives it one, the check
  # template of the demo library. A .launchway/pipeline.yaml in it would
  # take this one's place.
  - name: demo-plain
    repo: ../../launchway-demo-plain
    branch: main
    poll: 5s
    pipeline:
      library: demo-library
      version: v2
      template: check
      with: { strict: false }
      on: { push: { branches: [main] } }

  # Launchway builds and tests itself.
  - name: launchway
    repo: ..
    branch: main
    poll: 15s

# Repositories of templates (and the scripts they run) that pipelines may
# use. A pipeline names one of these; it cannot name any other address.
libraries:
  - name: demo-library
    repo: ../../launchway-demo-library

runner:
  concurrency: 3
  executor: auto   # podman or docker if installed, otherwise the host
