# Launchway's own pipeline: test, build the image, and deploy it to itself (sandbox first, then dev).
# Runbook: docs/howto/self-deploy.md. Design: the self-hosting design notes (build, gates, gitops commit,
# watch, roll back). Everything below uses features that exist; docs/howto/self-deploy.md lists what does not.
#
# What an operator must have configured first (none of it is in this file, on purpose):
#   - runner: images.builders (project launchway), images.registries.harbor with a push rule for
#     launchway/launchway only, images.signing (the runner's own key), a secret store `ci`.
#   - server: environments launchway-sandbox and launchway-dev (dev protected), a deploy runner pool,
#     verification sources `prometheus` and `loki`.
#   - deploy runner: repos.gitops (homelab-gitops, paths limited to the two launchway files per
#     environment), applications limited to launchway-sandbox and launchway-dev, accept: limited to the same.
pipeline: launchway
on:
  # Feature branches run the checks and the full test suite on the build cluster, so
  # nothing heavy has to run on a developer's machine. Only main builds images and deploys.
  push: { branches: [main, "feat/*", "fix/*", "chore/*"] }
  pull_request: {}

# A newer push to the same branch, or a new commit on the same pull request, cancels the older run
# still going. A run holding an open deployment is never cancelled this way: it finishes first.
supersede: true

steps:
  # A push that changes only documentation (docs/ or Markdown files) builds the docs and nothing else: every
  # step below is skipped by its path rule ("no file ... changed"), so no image is built and nobody is asked
  # to approve a deploy. The docs are published by .github/workflows/docs-pages.yml from the same push.
  docs:
    description: Build the documentation site
    image: docker.io/library/node:24-alpine
    cache:
      - name: npm
        paths: [.cache/npm]
        key: { files: ["docs/package-lock.json"], text: node-24 }
        fallback: latest
        max_age: 7d
    run: |
      export npm_config_cache="$PWD/.cache/npm"
      # The site has grown past Node's default heap (about 1 GB): give the build 3 GB of the step's 4.
      export NODE_OPTIONS="--max-old-space-size=3072"
      cd docs
      npm ci --no-audit --no-fund
      npx vitepress build .
    resources: { cpu: 1, memory: 4Gi }

  check-code:
    description: Look for common mistakes with go vet
    image: docker.io/library/golang:1.27
    run: |
      # The module and build caches live in the workspace, where the step's cache saves them (the key is the
      # lock files and the toolchain, so a changed dependency or Go version starts a new one).
      export GOMODCACHE="${GOMODCACHE:-$PWD/.cache/go-mod}" GOCACHE="$PWD/.cache/go-build" GOFLAGS="${GOFLAGS:-} -modcacherw"
      go vet ./...
    when: { changed: [ "**", "!docs/**", "!**/*.md" ] }
    cache:
      - name: go
        paths: [.cache/go-mod, .cache/go-build]
        key: { files: ["**/go.sum"], text: go-1.27 }
        fallback: latest
        max_age: 7d
    resources: { cpu: 1, memory: 2Gi }

  test:
    description: Run every Go test
    image: docker.io/library/golang:1.27
    needs: check-code
    # The results go to a report file as go test -json; the step still fails
    # when a test fails (the exit status is kept, not lost in a pipe).
    run: |
      # The module and build caches live in the workspace, where the step's cache saves them (the key is the
      # lock files and the toolchain, so a changed dependency or Go version starts a new one).
      export GOMODCACHE="${GOMODCACHE:-$PWD/.cache/go-mod}" GOCACHE="$PWD/.cache/go-build" GOFLAGS="${GOFLAGS:-} -modcacherw"
      mkdir -p reports
      status=0
      go test -count=1 -timeout 18m -json ./... > reports/go-test.json || status=$?
      # One line per package in the log, and for each failure its name and the last lines of
      # its output (scripts/ci/go-test-summary.sh); every test, with its whole output, is in
      # the Tests tab.
      sh scripts/ci/go-test-summary.sh reports/go-test.json
      exit $status
    reports:
      tests: reports/go-test.json
    cache:
      - name: go
        paths: [.cache/go-mod, .cache/go-build]
        key: { files: ["**/go.sum"], text: go-1.27 }
        fallback: latest
        max_age: 7d
    # The api package alone runs about 12 minutes on the step's 2 CPUs, so go test gets 18m, not its 10m default (the step has 20m).
    # Killed for memory twice as the suite grew (last at 6Gi); 8Gi is what the local pipeline-like run uses.
    when: { changed: [ "**", "!docs/**", "!**/*.md" ] }
    resources: { cpu: 2, cpu_limit: 4, memory: 4Gi, memory_limit: 8Gi }
    timeout: 20m

  # Security gates that need only the toolchain (docs/security/how-launchway-is-scanned.md). The ones
  # that need a container runtime (secret scan of the history, Trivy and hadolint on the manifests, the
  # ZAP baseline) run in .github/workflows/security.yml and with `make security` on a developer machine.
  security-go:
    description: Reachable Go vulnerabilities fail; a short fuzz run of every parser
    image: docker.io/library/golang:1.27
    # After test, not beside it: steps that use the same image share one container and its memory limit on a
    # Station, and both compiling the whole module at once was killed for memory (run 79). Running second,
    # this step also starts from the build cache the test step just filled.
    needs: [check-code, test]
    run: |
      # The module and build caches live in the workspace, where the step's cache saves them (the key is the
      # lock files and the toolchain, so a changed dependency or Go version starts a new one).
      export GOMODCACHE="${GOMODCACHE:-$PWD/.cache/go-mod}" GOCACHE="$PWD/.cache/go-build" GOFLAGS="${GOFLAGS:-} -modcacherw"
      go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      FUZZTIME=20s scripts/security/fuzz.sh
    when: { changed: [ "**", "!docs/**", "!**/*.md" ] }
    cache:
      - name: go
        paths: [.cache/go-mod, .cache/go-build]
        key: { files: ["**/go.sum"], text: go-1.27 }
        fallback: latest
        max_age: 7d
    resources: { cpu: 2, memory: 3Gi }
    timeout: 20m

  security-web:
    description: npm audit of the web UI and the documentation tools (high and above fail)
    image: docker.io/library/node:24-alpine
    needs: check-code
    run: |
      (cd web && npm audit --package-lock-only --audit-level=high)
      (cd docs && npm audit --package-lock-only --audit-level=high)
    when: { changed: [ "**", "!docs/**", "!**/*.md" ] }
    resources: { cpu: 500m, memory: 512Mi }

  build-ui:
    description: Build the web UI into web/dist
    image: docker.io/library/node:24-alpine
    needs: test   # after test, because building the UI rewrites web/dist
    run: |
      export npm_config_cache="$PWD/.cache/npm"
      cd web
      npm ci --no-audit --no-fund
      npm run build
    when: { changed: [ "**", "!docs/**", "!**/*.md" ] }
    cache:
      - name: npm
        paths: [.cache/npm]
        key: { files: ["web/package-lock.json"], text: node-24 }
        fallback: latest
        max_age: 7d
    resources: { cpu: 1, memory: 2Gi }

  build-binary:
    description: Build the launchway binary, with the UI inside it
    image: docker.io/library/golang:1.27
    needs: build-ui
    run: |
      # The module and build caches live in the workspace, where the step's cache saves them (the key is the
      # lock files and the toolchain, so a changed dependency or Go version starts a new one).
      export GOMODCACHE="${GOMODCACHE:-$PWD/.cache/go-mod}" GOCACHE="$PWD/.cache/go-build" GOFLAGS="${GOFLAGS:-} -modcacherw"
      version=$(echo "$LAUNCHWAY_COMMIT" | cut -c1-8)
      CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$version" -o bin/launchway ./cmd/launchway
      ls -lh bin/launchway
      echo "size=$(du -h bin/launchway | cut -f1)" >> "$LAUNCHWAY_OUTPUTS"
    when: { changed: [ "**", "!docs/**", "!**/*.md" ] }
    cache:
      - name: go
        paths: [.cache/go-mod, .cache/go-build]
        key: { files: ["**/go.sum"], text: go-1.27 }
        fallback: latest
        max_age: 7d
    resources: { cpu: 2, memory: 3Gi }

  # The new binary checks the pipeline files that ship with it. (The design also asks the RUNNING
  # server to validate them and the previous binary to read the new configuration; neither check
  # exists yet, see the gaps in docs/howto/self-deploy.md.)
  gate-pipeline:
    description: The built binary reads this repository's own pipeline
    image: docker.io/library/golang:1.27
    needs: build-binary
    run: bin/launchway validate .launchway/pipeline.yaml
    when: { changed: [ "**", "!docs/**", "!**/*.md" ] }
    resources: { cpu: 500m, memory: 512Mi }

  # ---- the image ---------------------------------------------------------------------------
  # The image is built from the sources alone. The workspace by now also holds the steps' caches (Go
  # modules and build cache, npm) and node_modules, several gigabytes that the builder would never read
  # but that would be copied out of the Sortie's pod with the build context and can pass its size limit.
  image-context:
    description: Set the sources apart for the image build
    image: docker.io/library/golang:1.27
    needs: [test, gate-pipeline, security-go, security-web]
    when: { branch: main, changed: [ "**", "!docs/**", "!**/*.md" ] }
    run: |
      rm -rf build/context && mkdir -p build/context
      tar -cf - --exclude=./.git --exclude=./.cache --exclude=./build --exclude=./bin --exclude=./reports \
        --exclude=./web/node_modules --exclude=./web/dist --exclude=./docs/node_modules \
        --exclude=./docs/.vitepress/dist --exclude=./docs/.vitepress/cache . | tar -xf - -C build/context
      du -sh build/context
    resources: { cpu: 500m, memory: 512Mi }
    timeout: 10m

  image:
    description: Build, scan, sign and push the Launchway image by digest
    kind: image
    needs: image-context
    context: build/context
    file: build/context/Dockerfile   # builds the UI and the binary itself
    build_args:
      VERSION:  { run: short_sha }
      REVISION: { run: sha }    # org.opencontainers.image.revision = the commit, never "unknown"
      CREATED:  { run: commit_time }  # the commit's time, never the wall clock: a rebuild is the same image
    tags:
      # Immutable by registry rule; never latest. The tag is for people, the digest is what deploys.
      - { registry: harbor, repository: launchway/launchway, tag: { run: short_sha } }
    cache: { registry: harbor, repository: launchway/buildkit-cache }
    sbom: true
    provenance: true
    sign: true                  # the runner's own key; step pods never see it
    scan: { fail_on: high, mode: enforce }   # nothing is pushed if this fails
    when: { branch: main, changed: [ "**", "!docs/**", "!**/*.md" ] }      # pull requests build and scan in their own run, never push
    retry: 2                    # a first connection to a registry is sometimes refused while the
                                # cluster's DNS-based egress rules catch up; a scan finding is not retried away
    timeout: 45m

  # ---- sandbox first -----------------------------------------------------------------------
  approve-sandbox:
    kind: approval
    needs: image
    when: { branch: main, changed: [ "**", "!docs/**", "!**/*.md" ] }
    message: >-
      Deploy this commit to the Launchway SANDBOX? The image step shows the digest, signature, SBOM and
      scan counts. This changes helm-values/launchway-sandbox.yaml and the chart pin of the sandbox
      Application in the GitOps repository, and nothing else. The database is dumped first (Argo CD
      PreSync job). Roll back is a git revert; the database is never restored for a rollback.
    timeout: 24h

  deploy-sandbox:
    kind: deploy
    needs: [image, approve-sandbox]
    when: { branch: main, changed: [ "**", "!docs/**", "!**/*.md" ] }
    environment: launchway-sandbox
    service: launchway
    version: { run: short_sha }
    timeout: 45m
    argocd:
      application: launchway-sandbox
      write_back:
        repo: gitops
        branch: main
        changes:
          - { file: helm-values/launchway-sandbox.yaml, set: image.tag,    value: { run: short_sha } }
          - { file: helm-values/launchway-sandbox.yaml, set: image.digest, value: { output: image.digest } }
          # The chart is pinned to a commit: it travels with the image, in the same GitOps commit.
          - { file: argocd-apps/launchway-sandbox.yaml, set: "spec.sources[0].targetRevision", value: { run: sha } }
      # Argo CD syncs this Application by itself: ask it for nothing.
      sync: { request: never, windows: wait }
      health: application
    rollout: { name: launchway-sandbox-server, namespace: launchway-sandbox }

  verify-sandbox:
    kind: verify
    needs: deploy-sandbox
    when: { branch: main, changed: [ "**", "!docs/**", "!**/*.md" ] }
    deployment: deploy-sandbox
    delay: 1m
    duration: 10m
    interval: 1m
    on_fail: rollback
    on_inconclusive: fail
    params:
      ns: { deployment: namespace }
    metrics:
      - name: ready-servers
        source: prometheus
        query: 'sum(kube_pod_status_ready{namespace="{{ns}}",condition="true",pod=~".*-server-.*"})'
        direction: lower-is-worse
        min: 2
      - name: restarts
        source: prometheus
        query: 'sum(increase(kube_pod_container_status_restarts_total{namespace="{{ns}}"}[5m]))'
        max: 0
    logs:
      - name: server
        source: loki
        query: '{namespace="{{ns}}", container="server"}'

  rollback-sandbox:
    kind: rollback
    needs: verify-sandbox
    deployment: deploy-sandbox
    timeout: 20m

  # ---- the same digest to dev --------------------------------------------------------------
  approve-dev:
    kind: approval
    needs: verify-sandbox
    when: { branch: main, changed: [ "**", "!docs/**", "!**/*.md" ] }
    message: >-
      The sandbox ran this digest and the verification passed. Deploy THE SAME DIGEST to launchway-dev, the
      instance that runs this pipeline? A person other than the one who pushed must approve. The commit
      changes helm-values/launchway-dev.yaml and the chart pin of the launchway-dev Application and
      nothing else; a database dump is taken first. Not for a release that raises the database
      schema minimum (those are deployed by hand, with the owner).
    timeout: 24h

  deploy-dev:
    kind: deploy
    needs: [image, approve-dev]
    when: { branch: main, changed: [ "**", "!docs/**", "!**/*.md" ] }
    environment: launchway-dev
    service: launchway
    version: { run: short_sha }
    timeout: 45m
    argocd:
      application: launchway-dev
      write_back:
        repo: gitops
        branch: main
        changes:
          - { file: helm-values/launchway-dev.yaml, set: image.tag,    value: { run: short_sha } }
          - { file: helm-values/launchway-dev.yaml, set: image.digest, value: { output: image.digest } }
          - { file: argocd-apps/launchway-dev.yaml, set: "spec.sources[0].targetRevision", value: { run: sha } }
      sync: { request: never, windows: wait }
      health: application
    # The Argo Rollout's canary gates (analysis) are the verdict; Launchway watches and records.
    rollout: { name: launchway-dev-server, namespace: launchway-dev }

  verify-dev:
    kind: verify
    needs: deploy-dev
    when: { branch: main, changed: [ "**", "!docs/**", "!**/*.md" ] }
    deployment: deploy-dev
    delay: 1m
    duration: 15m
    interval: 1m
    on_fail: rollback
    on_inconclusive: fail
    params:
      ns: { deployment: namespace }
    metrics:
      - name: ready-servers
        source: prometheus
        query: 'sum(kube_pod_status_ready{namespace="{{ns}}",condition="true",pod=~".*-server-.*"})'
        direction: lower-is-worse
        min: 2
      - name: restarts
        source: prometheus
        query: 'sum(increase(kube_pod_container_status_restarts_total{namespace="{{ns}}"}[5m]))'
        max: 0
    logs:
      - name: server
        source: loki
        query: '{namespace="{{ns}}", container="server"}'

  rollback-dev:
    kind: rollback
    needs: verify-dev
    deployment: deploy-dev
    timeout: 20m
