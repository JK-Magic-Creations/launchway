# FLIGHT PLAN for a Go program that ships as a container image.
#
#   ci: { uses: launchway/go-service }
#
# Runs: gofmt and go vet, the tests (go test -json for the Tests tab and a coverage profile for the Coverage tab), go build, govulncheck, a secret scan, and the image from the Dockerfile: built, scanned, with its bill of materials and signed; pushed when you set push: true and image_repository.
# The Go version comes from the image tag go_version (the golang image fetches the newer toolchain go.mod asks for). The module cache is kept between runs under a key made of go.mod, go.sum and the Go version.
template: go-service
description: "Flight plan: a Go service or command with a Dockerfile: format, vet, test, build, scan and image"
params:
  working_directory: { type: string, default: ".", description: "The directory with the code, relative to the repository; use the template once for each directory of a monorepo" }
  go_version: { type: string, default: "1.27", description: "The Go version of the image: the golang image tag; the repository's go.mod may ask for a newer one and Go fetches it" }
  lint: { type: boolean, default: true, description: "Check formatting and style" }
  lint_mode: { type: string, default: "advise", options: ["advise", "enforce"], description: "Style findings advise (printed, never fail the run) or enforce (fail it)" }
  lint_command: { type: string, default: "", description: "Your own lint command, run in place of the default check" }
  test_command: { type: string, default: "", description: "Your own test command, in place of the default; write its report where this template's description says" }
  race: { type: boolean, default: false, description: "Run the tests with the race detector" }
  coverage_minimum: { type: number, default: "0", description: "Fail below this percentage of lines covered; 0 sets no threshold" }
  vuln_scan: { type: boolean, default: true, description: "Look for known vulnerabilities in the dependencies with govulncheck" }
  secret_scan: { type: boolean, default: true, description: "Look for private keys and provider tokens committed to the repository" }
  build: { type: boolean, default: true, description: "Build every package" }
  image: { type: boolean, default: true, description: "Build the image from the Dockerfile, scan it and make its software bill of materials" }
  push: { type: boolean, default: { nonempty: push_when }, description: "Push the image: on when the Flight has environments to deliver to and there is a registry to push to, off otherwise" }
  push_when: { type: list, from: launchway_pushing, default: [], description: "The environments an image is pushed for: the Flight's own, or none when this server has no registry to push to" }
  image_repository: { type: string, default: { text: "{image_namespace}/{service}" }, description: "The image's repository in the registry, without the host: team/app; by default the namespace and the Flight's name" }
  registry: { type: string, from: registry, default: { param: default_registry }, description: "The registry to push to: launchway (built into this server), or a name the Stations' configuration lists" }
  default_registry: { type: string, from: launchway_registry, default: "launchway", description: "What Launchway says the registry is when nothing else does: launchway, or registry.fallback when the built-in registry cannot serve here" }
  dockerfile: { type: string, default: "Dockerfile", description: "The Dockerfile, relative to the repository" }
  context: { type: string, default: ".", description: "The build context, relative to the repository" }
  image_branch: { type: string, default: "main", description: "The branch whose commits are built into an image" }
  scan_mode: { type: string, default: "enforce", options: ["report", "enforce"], description: "enforce fails the image step on a serious finding (high and worse); report records findings and goes on" }
  sign: { type: boolean, default: true, description: "Sign the image with the runner's own key" }
  sbom: { type: boolean, default: true, description: "Make the image's software bill of materials" }
  tools_image: { type: string, default: "docker.io/library/alpine:3.22", description: "An image with a shell, for the small steps" }
  analysis: { type: boolean, default: true, description: "Static analysis (staticcheck)" }
  analysis_mode: { type: string, default: "report", options: ["enforce", "report"], description: "Findings of the static analysis fail the run (enforce) or are only reported" }
  license_scan: { type: boolean, default: true, description: "List the licenses of the dependencies" }
  license_deny: { type: list, default: [], description: "Licenses that fail the run when a dependency has one; empty only lists them" }
  service: { type: string, from: launchway_project, default: "app", description: "What the Flight is called in deliveries and in the image's name; the Flight's own name" }
  moving_tag: { type: string, default: "", description: "A second, moving tag pushed with every build (ci-latest, for a Dockerfile that uses the image as a base); empty pushes only the commit's tag" }
  image_namespace: { type: string, from: image_namespace, default: "launchway", description: "The registry namespace of the image's repository; set once for every Flight with the variable image_namespace" }
  deliver: { type: list, from: launchway_environments, default: [], description: "The environments to deliver to, in order: the Flight's environments as the server's configuration lists them, protected ones behind a decision. [] turns delivery off" }
  deliver_branch: { type: string, default: { param: image_branch }, description: "The branch whose commits are delivered; the image branch" }
  overrides: { type: list, from: delivery_overrides, default: [], description: "Delivery values for one environment, written environment.name=value: prod.application=shop, dev.port=3000, dev.verify=false (see the deliver maneuver)" }
  port: { type: number, default: "8080", description: "The port the service listens on, for the health address of a delivery" }
  health_path: { type: string, from: health_path, default: "/healthz", description: "The health path the proof after a deployment calls" }
  verify_for: { type: string, default: "5m", description: "The watch period after each deployment: the proof calls the service for this long, and a failed proof puts the previous version back" }
  method: { type: string, default: "image", options: ["image", "helm-values"], description: "How a delivery writes to the GitOps repository: rewrite the image in a manifest, or set image.tag and image.digest in a values file" }
  gitops_repo: { type: string, from: gitops_repo, default: "gitops", description: "The write-back repository, as the deploy runner's configuration names it" }
  gitops_branch: { type: string, from: gitops_branch, default: "main", description: "The branch of the GitOps repository that is written to" }
containers:
  go: { image: { param: go_version, format: "docker.io/library/golang:%s" } }
steps:
  check:
    description: Format and vet the Go code
    if: { param: lint }
    container: go
    services: []   # a database declared under containers: starts only for the test stage
    cache:
      - name: go
        paths: [.cache/go-mod, .cache/go-build]
        key: { files: ["**/go.sum", "**/go.mod"], text: { param: go_version, format: "go-%s" } }
        fallback: latest
    run: "$LAUNCHWAY_LIB/scripts/go/check.sh"
  test:
    description: Run every Go test
    container: go
    cache:
      - name: go
        paths: [.cache/go-mod, .cache/go-build]
        key: { files: ["**/go.sum", "**/go.mod"], text: { param: go_version, format: "go-%s" } }
        fallback: latest
    run: "$LAUNCHWAY_LIB/scripts/go/test.sh"
    reports:
      tests: ["**/reports/**/go-test.json"]
      coverage: { paths: ["**/reports/**/cover.out"], fail_under: { param: coverage_minimum } }
  build:
    description: Build every package
    if: { param: build }
    needs: [check, test]
    container: go
    services: []   # a database declared under containers: starts only for the test stage
    cache:
      - name: go
        paths: [.cache/go-mod, .cache/go-build]
        key: { files: ["**/go.sum", "**/go.mod"], text: { param: go_version, format: "go-%s" } }
        fallback: latest
    run: "$LAUNCHWAY_LIB/scripts/go/build.sh"
    artifacts:
      - { name: bin, paths: [bin] }
  # Named inspect-vuln-reach-go so that Standing orders keep this step and do not add the same check a second time
  # (docs/reference/standing-orders.md); it writes the report the Inspection's verdict reads.
  inspect-vuln-reach-go:
    description: Look for reachable vulnerabilities in the dependencies
    if: { param: vuln_scan }
    container: go
    services: []   # a database declared under containers: starts only for the test stage
    on_failure: continue
    timeout: 15m
    cache:
      - name: standing-go
        paths: [.standing/cache/gomod, .standing/cache/gobuild]
        key: { files: ["**/go.sum"], text: { param: go_version, format: "go-%s" } }
        fallback: latest
    reports: { findings: [".standing/vuln-reach-go-*.sarif"] }
    run: "$LAUNCHWAY_LIB/scripts/inspect-vuln-reach-go.sh"
  # Named inspect-secrets so that Standing orders keep this step and do not add the same check a second time
  # (docs/reference/standing-orders.md); it writes the report the Inspection's verdict reads.
  inspect-secrets:
    description: Look for secrets committed by mistake
    if: { param: secret_scan }
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
    on_failure: continue
    timeout: 10m
    reports: { findings: [.standing/secrets.sarif] }
    run: "$LAUNCHWAY_LIB/scripts/inspect-secrets.sh"
  analysis:
    description: Static analysis with staticcheck
    if: { param: analysis }
    container: go
    services: []   # a database declared under containers: starts only for the test stage
    cache:
      - name: go
        paths: [.cache/go-mod, .cache/go-build]
        key: { files: ["**/go.sum", "**/go.mod"], text: { param: go_version, format: "go-%s" } }
        fallback: latest
    run: "$LAUNCHWAY_LIB/scripts/go/analysis.sh"
  licenses:
    description: List the licenses of the dependencies
    if: { param: license_scan }
    container: go
    services: []   # a database declared under containers: starts only for the test stage
    cache:
      - name: go
        paths: [.cache/go-mod, .cache/go-build]
        key: { files: ["**/go.sum", "**/go.mod"], text: { param: go_version, format: "go-%s" } }
        fallback: latest
    run: "$LAUNCHWAY_LIB/scripts/go/licenses.sh"
  image:
    description: Build the image, scan it, and push it when push is on
    uses: image-build
    if: { param: image }
    needs: [check, test, inspect-vuln-reach-go, analysis, inspect-secrets]
    when: { branch: { param: image_branch } }
    with:
      image_repository: { param: image_repository }
      registry: { param: registry }
      dockerfile: { param: dockerfile }
      context: { param: context }
      push: { param: push }
      scan_mode: { param: scan_mode }
      sign: { param: sign }
      sbom: { param: sbom }
      moving_tag: { param: moving_tag }
      tools_image: { param: tools_image }
  deliver:
    description: Deliver the image to each environment in order, and put the previous version back if one fails
    uses: deliver
    if: { param: deliver, empty: false }
    needs: [image]
    for_each: { environment: { param: deliver } }
    serial: true
    fail_fast: false
    when: { branch: { param: deliver_branch } }
    with:
      environment: { each: environment }
      service: { param: service }
      image_repository: { param: image_repository }
      tag: { output: image.tag }
      digest: { output: image.digest }
      overrides: { param: overrides }
      port: { param: port }
      health_path: { param: health_path }
      verify_for: { param: verify_for }
      method: { param: method }
      gitops_repo: { param: gitops_repo }
      gitops_branch: { param: gitops_branch }
