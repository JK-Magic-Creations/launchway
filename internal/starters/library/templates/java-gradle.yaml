# FLIGHT PLAN for a Gradle project.
#
#   ci: { uses: launchway/java-gradle }
#
# Runs gradle build (the repository's ./gradlew if it has one) with the Gradle home cached between runs under a key made of the build files and the Java version, shows the test results in Tests and JaCoCo's report (when the build writes one) in Coverage, keeps the jars, scans for secrets, and builds the image when you set image: true.
template: java-gradle
description: "Flight plan: a Java or Kotlin project built with Gradle: build, tests and coverage, secret scan, optional image"
params:
  working_directory: { type: string, default: ".", description: "The directory with the code, relative to the repository; use the template once for each directory of a monorepo" }
  java_version: { type: string, default: "21", description: "The Java version of the image" }
  build_command: { type: string, default: "", description: "Your own build command, in place of the default" }
  secret_scan: { type: boolean, default: true, description: "Look for private keys and provider tokens committed to the repository" }
  image: { type: boolean, default: false, description: "Build an image from the Dockerfile (off: a library or tool has none)" }
  push: { type: boolean, default: false, description: "Push the image to the registry (also set image_repository); off until you say where" }
  image_repository: { type: string, default: "launchway/app", description: "The image's repository in the registry, without the host: team/app" }
  registry: { type: string, default: "launchway", description: "The registry to push to: launchway is the registry built into this server, or a name the runner's configuration lists" }
  dockerfile: { type: string, default: "Dockerfile", description: "The Dockerfile, relative to the repository" }
  context: { type: string, default: ".", description: "The build context, relative to the repository" }
  image_branch: { type: string, default: "main", description: "The branch whose commits are built into an image" }
  scan_mode: { type: string, default: "report", options: ["report", "enforce"], description: "report records findings; enforce fails the step on a serious one" }
  sign: { type: boolean, default: true, description: "Sign the image with the runner's own key" }
  sbom: { type: boolean, default: true, description: "Make the image's software bill of materials" }
  tools_image: { type: string, default: "docker.io/library/alpine:3.22", description: "An image with a shell, for the small steps" }
containers:
  java: { image: { param: java_version, format: "docker.io/library/gradle:8-jdk%s" } }
steps:
  build:
    description: Compile, test and package with Gradle
    container: java
    cache:
      - name: gradle
        paths: [.cache/gradle]
        key: { files: ["**/*.gradle", "**/*.gradle.kts", "**/gradle-wrapper.properties", "**/gradle.lockfile"], text: { param: java_version, format: "jdk-%s" } }
        fallback: latest
    run: "$LAUNCHWAY_LIB/scripts/java/gradle.sh"
    reports:
      tests: ["**/build/test-results/test/*.xml"]
      coverage: ["**/build/reports/jacoco/test/jacocoTestReport.xml"]
    artifacts:
      - { name: jar, paths: ["**/build/libs/*.jar"] }
  secrets:
    description: Look for secrets committed by mistake
    if: { param: secret_scan }
    image: { param: tools_image }
    run: "$LAUNCHWAY_LIB/scripts/secrets.sh"
  image:
    description: Build the image, scan it, and push it when push is on
    uses: image-build
    if: { param: image }
    needs: [build, secrets]
    when: { branch: { param: image_branch } }
    with:
      image_repository: { param: image_repository }
      registry: { param: registry }
      dockerfile: { param: dockerfile }
      context: { param: context }
      push: { param: push }
      scan_mode: { param: scan_mode }
      sign: { param: sign }
      sbom: { param: sbom }
      tools_image: { param: tools_image }
