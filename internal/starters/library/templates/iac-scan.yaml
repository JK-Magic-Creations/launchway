# MANEUVER: look for misconfigurations in infrastructure and configuration code (Terraform/OpenTofu, Ansible, Kubernetes manifests) with Trivy's config scanner (Apache-2.0).
#
#   scan: { uses: launchway/iac-scan }
template: iac-scan
description: "Maneuver: misconfiguration scan of infrastructure code with trivy config; SARIF findings"
params:
  image: { type: string, default: "docker.io/aquasec/trivy:0.58.1", description: "An image with trivy, pinned" }
  severity: { type: string, default: "HIGH,CRITICAL", description: "The severities reported" }
  mode: { type: string, default: "report", options: ["report", "enforce"], description: "report records findings; enforce fails the run" }
  check_updates: { type: boolean, default: false, description: "Download the newest checks first; off, the scanner uses its own, written for its version (the newest may need a newer scanner)" }
containers:
  trivy: { image: { param: image } }
steps:
  scan:
    description: Scan the definitions
    container: trivy
    reports: { findings: [".launchway/scan/iac.sarif"] }
    run: "$LAUNCHWAY_LIB/scripts/iac-scan.sh"
