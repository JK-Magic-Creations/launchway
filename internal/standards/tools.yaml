# The tool images Standing orders run, pinned by digest. This is the only place a tool image is
# named; the code reads this file when the program is built (go:embed) and a test refuses a tool
# without a digest.
#
# To update a tool: change `version` and `image` together (the digest of a multi-architecture image
# is `skopeo inspect --format '{{.Digest}}' docker://IMAGE:TAG`), then run
# `go test ./internal/standards`. The dependency updater reads the `image:` lines of this file like
# those of any pipeline file (add this path to image_globs in .launchway/updates.yaml) and
# proposes the new digest as a pull request, which is the same review as any other change.
