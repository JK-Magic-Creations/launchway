include:
  - local: ci/jobs.yml
  - remote: https://ci.example.test/shared.yml
  - project: team/shared
    file: /base.yml

stages: [build, test, deploy]

variables:
  GOFLAGS: -mod=readonly
  APP: shop

default:
  image: golang:1.22
  retry: 1
  timeout: 1h 30m

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

.base: &base
  tags: [docker]
  before_script:
    - echo "start $CI_JOB_NAME"

build:
  <<: *base
  stage: build
  script:
    - go build ./...
    - echo $CI_COMMIT_SHA > sha.txt
  artifacts:
    name: binaries
    paths: [bin/]
    expire_in: 1 week
    when: always
  cache:
    key:
      files: [go.sum]
      prefix: gomod
    paths: [.cache/go-mod, ~/.npm]
    policy: pull-push

unit:
  extends: .base
  stage: test
  services:
    - name: postgres:16
      alias: db
      variables:
        POSTGRES_PASSWORD: test
  script:
    - go test ./... -coverprofile=cover.out
    - !reference [.base, before_script]
  after_script:
    - echo done
  allow_failure: true
  coverage: '/total:\s+(\d+)%/'
  artifacts:
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      sast: gl-sast.json
    exclude: [tmp/**]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

shards:
  stage: test
  parallel: 3
  script: ./run-shard.sh $CI_NODE_INDEX/$CI_NODE_TOTAL

versions:
  stage: test
  image:
    name: python:3.12
    entrypoint: [""]
  parallel:
    matrix:
      - PYTHON: ["3.11", "3.12"]
        DB: [pg]
  script: pytest --py $PYTHON
  needs: [build]

release:
  stage: deploy
  needs:
    - job: build
    - job: other-project-job
      project: team/other
      ref: main
  environment:
    name: production
    url: https://shop.example.test
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
  script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
