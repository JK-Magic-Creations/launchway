name: odd
on: [push, workflow_run]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golangci/golangci-lint-action@v6
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - shell: pwsh
        run: Write-Host hello
      - run: |
          if [[ -n "$X" ]]; then echo yes; fi
          echo "v=1" >> $GITHUB_OUTPUT
          echo "PATH=$PWD/bin:$PATH" >> $GITHUB_ENV
        shell: bash
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 3
      - run: echo ${{ format('{0}-{1}', github.repository, vars.REGION) }} ${{ github.actor }}
  win:
    runs-on: windows-latest
    steps:
      - run: echo windows
  reuse:
    uses: ./.github/workflows/shared.yml
    with:
      x: 1
  dyn:
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.lint.outputs.matrix) }}
    steps:
      - run: echo dyn
  cond:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[ci]')
    steps:
      - run: echo conditional
  extra:
    runs-on: ubuntu-latest
    needs: lint
    concurrency: deploy-lock
    strategy:
      matrix:
        py: ["3.11", "3.12"]
        include:
          - py: "3.13"
            experimental: true
    steps:
      - run: echo ${{ vars.REGION }} ${{ matrix.py }}
