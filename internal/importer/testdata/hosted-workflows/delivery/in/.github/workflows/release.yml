name: release
on:
  push:
    tags: ["v*"]
    branches-ignore: [wip/**]
  pull_request_target:
    branches: ["!docs"]
  release:
    types: [published]
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.example.test
          username: ${{ secrets.REG_USER }}
          password: ${{ secrets.REG_PASSWORD }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: registry.example.test/team/shop
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            registry.example.test/team/shop:${{ github.sha }}
            registry.example.test/team/shop:latest
          build-args: |
            VERSION=1.2.3
            COMMIT=${{ github.sha }}
  deploy:
    runs-on: ubuntu-latest
    needs: image
    environment:
      name: production
      url: https://shop.example.test
    steps:
      - uses: actions/checkout@v4
      - name: Roll out
        run: kubectl set image deployment/shop shop=registry.example.test/team/shop:${{ github.sha }}
        env:
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
      - run: echo "$GITHUB_SHA on $GITHUB_REF_NAME"
  publish:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - run: npm publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
