{{- $fullname := include "launchway.fullname" . -}}
{{- $sa := include "launchway.serverServiceAccount" . -}}
{{- if .Values.server.serviceAccount.create }}
# The servers need no access to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "launchway.componentLabels" (list . "server") | nindent 4 }}
  {{- with .Values.server.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "launchway.componentLabels" (list . "server") | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "launchway.componentSelectorLabels" (list . "server") | nindent 6 }}
  strategy:
    type: RollingUpdate
    {{- with .Values.server.strategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "launchway.componentLabels" (list . "server") | nindent 8 }}
        {{- with .Values.server.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "launchway.serverConfig" . | sha256sum }}
        {{- with .Values.server.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $sa }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.server.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with include "launchway.spread" (list . "server") | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "launchway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server", "--config", "/etc/launchway/launchway.yaml"]
          env:
            {{- include "launchway.databaseEnv" . | nindent 12 }}
            - name: LAUNCHWAY_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "launchway.runnerTokenSecretName" . }}
                  key: {{ include "launchway.runnerTokenSecretKey" . }}
            {{- with ((.Values.config.artifacts | default dict).s3 | default dict).existingSecret }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ . }}, key: AWS_ACCESS_KEY_ID }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ . }}, key: AWS_SECRET_ACCESS_KEY }
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ . }}, key: AWS_SESSION_TOKEN, optional: true }
            {{- end }}
            {{- if .Values.delivery.deployRunner.enabled }}
            - name: LAUNCHWAY_DEPLOY_POOL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "launchway.deployPoolSecretName" . }}
                  key: {{ include "launchway.deployPoolSecretKey" . }}
            {{- end }}
            {{- with include "launchway.encryptionEnv" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: LAUNCHWAY_EXTERNAL_URL
              value: {{ .Values.externalURL | quote }}
            {{- if eq (include "launchway.authMode" .) "local" }}
            - name: LAUNCHWAY_SETUP_CODE_FILE
              value: /etc/launchway-setup/code
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ include "launchway.port" . }}
              protocol: TCP
            {{- if .Values.ssh.enabled }}
            - name: ssh
              containerPort: {{ .Values.ssh.port }}
              protocol: TCP
            {{- end }}
          {{- with .Values.server.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.server.preStopSleepSeconds }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.server.preStopSleepSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/launchway
              readOnly: true
            - name: data
              mountPath: /var/lib/launchway
            - name: tmp
              mountPath: /tmp
            {{- if eq (include "launchway.authMode" .) "local" }}
            - name: setup-code
              mountPath: /etc/launchway-setup
              readOnly: true
            {{- end }}
            {{- if include "launchway.encryptionSources" . | trim }}
            - name: root-key
              mountPath: /etc/launchway-keys
              readOnly: true
            {{- end }}
            {{- with .Values.server.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-server
        - name: data
          emptyDir:
            {{- with .Values.server.dataVolume.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if eq (include "launchway.authMode" .) "local" }}
        # The one-time code for the first administrator (made by the install hook Job). optional: the
        # server reads the file only while no administrator exists, and starts without it.
        - name: setup-code
          secret:
            secretName: {{ include "launchway.setupCodeSecretName" . }}
            optional: true
            defaultMode: 0440
        {{- end }}
        {{- with include "launchway.encryptionSources" . | trim }}
        - name: root-key
          projected:
            defaultMode: 0440
            sources:
              {{- . | nindent 14 }}
        {{- end }}
        {{- with .Values.server.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "launchway.componentLabels" (list . "server") | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "launchway.componentSelectorLabels" (list . "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.ssh.enabled }}
---
# Git over SSH: its own Service, so it can be published on its own address (a LoadBalancer, or a TCP route).
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-ssh
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "launchway.componentLabels" (list . "server") | nindent 4 }}
  {{- with .Values.ssh.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ssh.service.type }}
  selector:
    {{- include "launchway.componentSelectorLabels" (list . "server") | nindent 4 }}
  ports:
    - name: ssh
      port: {{ .Values.ssh.service.port }}
      targetPort: ssh
      protocol: TCP
{{- end }}
{{- if .Values.server.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "launchway.componentLabels" (list . "server") | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.server.podDisruptionBudget.maxUnavailable }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "launchway.componentSelectorLabels" (list . "server") | nindent 6 }}
{{- end }}
