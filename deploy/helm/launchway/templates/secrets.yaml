{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "launchway.databaseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "launchway.componentLabels" (list . "server") | nindent 4 }}
type: Opaque
data:
  url: {{ include "launchway.databaseURL" . | b64enc | quote }}
{{- end }}
{{- if not .Values.runnerToken.existingSecret }}
{{- $name := include "launchway.runnerTokenSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- if and $existing $existing.data (index $existing.data "token") }}
{{- $token = index $existing.data "token" }}
{{- else }}
{{- $token = randAlphaNum 48 | b64enc }}
{{- end }}
---
# The token runners present to the servers. Generated on first install and kept on upgrade.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "launchway.componentLabels" (list . "server") | nindent 4 }}
type: Opaque
data:
  token: {{ $token | quote }}
{{- end }}
