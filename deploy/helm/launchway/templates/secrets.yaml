{{- /* Only a database URL the user gave. Nothing is generated here: the root key, the runner token,
       the bundled database's password and the setup code are made once by the install hook Job
       (bootstrap.yaml), so no Secret material appears in a rendered manifest. */ -}}
{{- if .Values.database.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "launchway.databaseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "launchway.componentLabels" (list . "server") | nindent 4 }}
type: Opaque
data:
  url: {{ include "launchway.databaseURL" . | b64enc | quote }}
{{- end }}
