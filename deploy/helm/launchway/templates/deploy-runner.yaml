{{- include "launchway.validateDelivery" . -}}
{{- $r := .Values.delivery.deployRunner -}}
{{- if $r.enabled }}
{{- $name := include "launchway.deployRunnerName" . -}}
{{- /* The pool token's Secret (unless one is named) is made once by the install hook Job. */ -}}
{{- /* The rest is shared with the launchway-runner chart (deploy/helm/shared). */ -}}
{{- include "launchway.shared.deployRunner" (dict "root" . "r" $r "name" $name "sa" $name "component" "deploy-runner" "server" (include "launchway.runnerServerURL" .) "verification" .Values.delivery.verification "tokenSecret" (include "launchway.deployPoolSecretName" .) "tokenKey" (include "launchway.deployPoolSecretKey" .)) }}
{{- end }}
