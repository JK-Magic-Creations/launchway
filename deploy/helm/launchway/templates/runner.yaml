{{- if .Values.runner.enabled }}
{{- $fullname := include "launchway.fullname" . -}}
{{- $sa := include "launchway.runnerServiceAccount" . -}}
{{- $stepNamespace := include "launchway.stepNamespace" . -}}
{{- if and .Values.runner.kubernetes.createNamespace (eq (toString .Values.runner.kubernetes.restricted) "false") (eq (index (.Values.runner.kubernetes.namespaceLabels | default dict) "pod-security.kubernetes.io/enforce") "restricted") }}
{{- fail "runner.kubernetes.restricted is false, so step pods run as their images' users and do not meet Pod Security \"restricted\", which runner.kubernetes.namespaceLabels enforces on the step namespace. Set namespaceLabels.\"pod-security.kubernetes.io/enforce\" to baseline." }}
{{- end }}
{{- if and .Values.runner.kubernetes.createNamespace (ne $stepNamespace .Release.Namespace) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $stepNamespace }}
  labels:
    {{- include "launchway.componentLabels" (list . "runner") | nindent 4 }}
    {{- with .Values.runner.kubernetes.namespaceLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- end }}
{{- if .Values.runner.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "launchway.componentLabels" (list . "runner") | nindent 4 }}
  {{- with .Values.runner.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The token is mounted only into the runner pods, which ask for it.
automountServiceAccountToken: false
---
{{- end }}
{{- if .Values.runner.rbac.create }}
# Exactly what the Kubernetes executor uses, in the step namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-runner
  namespace: {{ $stepNamespace }}
  labels:
    {{- include "launchway.componentLabels" (list . "runner") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete", "patch"]
  # Exec is a POST (SPDY) or a GET (WebSocket); which verb is checked depends on the
  # Kubernetes version, so both are granted.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-runner
  namespace: {{ $stepNamespace }}
  labels:
    {{- include "launchway.componentLabels" (list . "runner") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-runner
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "launchway.componentLabels" (list . "runner") | nindent 4 }}
spec:
  replicas: {{ .Values.runner.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "launchway.componentSelectorLabels" (list . "runner") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "launchway.componentLabels" (list . "runner") | nindent 8 }}
        {{- with .Values.runner.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "launchway.runnerConfig" . | sha256sum }}
        {{- with .Values.runner.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $sa }}
      # The Kubernetes executor finds the API server and its credentials through the
      # in-cluster configuration: this token and KUBERNETES_SERVICE_HOST/PORT.
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.runner.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.runner.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with include "launchway.spread" (list . "runner") | trim }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.runner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: runner
          image: {{ include "launchway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - runner
            - --config=/etc/launchway-runner/runner.yaml
            - --health-listen=:{{ .Values.runner.healthPort }}
            {{- range .Values.runner.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          # The runner's name (and its identity on the server) defaults to the pod name.
          env:
            {{- if and .Values.runner.join .Values.runner.join.existingSecret }}
            # Each pod enrols with the join token at start (schema 20) and gets an identity of
            # its own, kept in its data volume.
            - name: LAUNCHWAY_JOIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runner.join.existingSecret }}
                  key: {{ .Values.runner.join.existingSecretKey | default "token" }}
            {{- else }}
            - name: LAUNCHWAY_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "launchway.runnerTokenSecretName" . }}
                  key: {{ include "launchway.runnerTokenSecretKey" . }}
            {{- end }}
            {{- with .Values.runner.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.runner.healthPort }}
              protocol: TCP
          {{- with .Values.runner.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.runner.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/launchway-runner
              readOnly: true
            - name: data
              mountPath: /var/lib/launchway-runner
            - name: tmp
              mountPath: /tmp
            {{- with (.Values.runner.images | default dict) }}
            {{- if and .builders .tlsSecret }}
            - name: buildkit-tls
              mountPath: /var/run/launchway/buildkit
              readOnly: true
            {{- end }}
            {{- if and .builders .signingSecret }}
            - name: signing
              mountPath: /var/run/launchway/signing
              readOnly: true
            {{- end }}
            {{- end }}
            {{- with .Values.runner.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-runner
        - name: data
          emptyDir:
            {{- with .Values.runner.dataVolume.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- with (.Values.runner.images | default dict) }}
        {{- if and .builders .tlsSecret }}
        - name: buildkit-tls
          secret:
            secretName: {{ .tlsSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if and .builders .signingSecret }}
        - name: signing
          secret:
            secretName: {{ .signingSecret }}
            defaultMode: 0440
        {{- end }}
        {{- end }}
        {{- with .Values.runner.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- if .Values.runner.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "launchway.componentLabels" (list . "runner") | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.runner.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "launchway.componentSelectorLabels" (list . "runner") | nindent 6 }}
{{- end }}
{{- end }}
