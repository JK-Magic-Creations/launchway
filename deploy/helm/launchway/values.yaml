# Default values for the Launchway chart. See deploy/README.md for a walk-through and
# examples/ha.yaml for a production-shaped example.
#
# One of these is required, or the install fails:
#   database.url, database.existingSecret, or postgresql.enabled=true (for trying the chart only).

# -- Overrides the chart name in resource names.
nameOverride: ""
# -- Overrides the full resource name prefix (default: <release>-launchway).
fullnameOverride: ""
# -- Labels added to every resource the chart creates.
commonLabels: {}

image:
  # -- The Launchway image; servers and runners use the same one.
  repository: ghcr.io/jk-magic-creations/launchway
  # -- The image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- An image digest (sha256:...). When set it is used instead of the tag.
  digest: ""
  pullPolicy: IfNotPresent

# -- Secrets for pulling the Launchway (and development PostgreSQL) image, by name.
imagePullSecrets: []

# ---------------------------------------------------------------------------------------------
# The server configuration file. The chart renders it into a ConfigMap mounted at
# /etc/launchway/launchway.yaml; changing it restarts the servers. The database URL and the
# runner token are never written here: they reach the servers as environment variables from
# Secrets. Servers always run with their built-in runner disabled; steps run on the runners
# below.
# ---------------------------------------------------------------------------------------------
# A NOTE ON DEFAULTS. Settings that newer versions added are left unset here and take the
# program's built-in default, so that the configuration this chart writes by default can still be
# read by the version before it: during an upgrade, and after an aborted one, pods of both
# versions read the same ConfigMap, and a server refuses a setting it does not know.
config:
  # -- Address the servers listen on, inside the pod. The port is also the container port.
  listen: 0.0.0.0:8080
  # -- Repositories to watch. Each needs a URL the servers and runners can clone
  # (https://... or ssh://...). Example:
  #   - name: payments
  #     repo: https://git.example.com/team/payments.git
  #     branch: main     # default branch for manual runs
  #     poll: 30s        # how often to look for pushes
  #     # Optional: let the pipeline editor commit to the repository, with the servers'
  #     # Git credentials (in the URL, or GIT_CONFIG_* variables in server.extraEnv).
  #     push: { branch_prefix: launchway/, allow_direct: [] }
  #     # Optional: who may start draft runs of unsaved pipeline text here (overrides
  #     # drafts: in extraConfig).
  #     drafts: { allow: admin, secrets: false }
  #     # Optional: let steps of pull-request runs read secrets here (overrides
  #     # pull_requests: in extraConfig; the default is no).
  #     pull_requests: { secrets: false }
  #     # Optional: turn this project's schedules off (overrides config.schedules.enabled).
  #     schedules: { enabled: false }
  #     # Optional: the Git host's webhook, which makes the servers poll at once. The secret
  #     # comes from an environment variable (server.extraEnv, from a Secret) or a file.
  #     git_webhook: { kind: github, secret_env: PAYMENTS_HOOK_SECRET }
  #     # Optional: what callers of the pipeline's webhook triggers must prove, by name:
  #     # one of token_env, token_file, hmac_secret_env, hmac_secret_file.
  #     webhooks:
  #       deploy-request: { hmac_secret_env: PAYMENTS_DEPLOY_HMAC }
  projects: []
  # -- What the servers keep of the test reports steps declare (reports.tests in a pipeline).
  # Each step attempt's summary is kept with the run's events; individual results go in a table
  # of their own, within these limits.
  tests:
    # -- MiB of report files a server accepts for one step attempt. Runners are told, and
    # collect no more; a result larger than this is refused and reported without its files.
    # Unset: the built-in default, 24.
    maxUploadMiB:
    # -- Individual test results one run keeps; beyond this only the totals are kept.
    # Unset: the built-in default, 50000.
    maxCasesPerRun:
    # -- Individual test results a project keeps over all its runs. When there are more, the
    # oldest runs' results are removed first (their totals stay). At least maxCasesPerRun.
    # Unset: the built-in default, 1000000.
    maxCasesPerProject:
  # -- Loops in pipelines (for_each).
  loops:
    # -- Combinations one loop may have; a run whose loop has more is refused.
    # Unset: the built-in default, 64 (at most 500).
    maxMembers:
  # -- Schedules in pipelines (on.schedule).
  schedules:
    # -- false turns every project's schedules off (a project's schedules: setting may turn
    # its own back on); their firings are recorded as skipped.
    # Unset: the built-in default, on.
    enabled:
  # -- API tokens.
  tokens:
    # -- The longest an API token may last, in days. Written as auth.tokens.max_days.
    # Unset: the built-in default, 365 (at most 3650).
    maxDays:
  # -- Any other top-level settings, merged into the file as they are, so that new settings
  # need no chart change. For example:
  #   user: ci-admin
  #   approvals: { allow_self: false }
  #   drafts: { allow: operator, secrets: false }   # the defaults
  #   pull_requests: { secrets: false }             # the default
  # The server rejects settings it does not know, so a typo here stops the servers from
  # starting (the pod logs say which key). listen, data, database, projects, tests, loops and
  # schedules are set by the chart and may not appear here; runner.enabled may not be true.
  extraConfig: {}

# ---------------------------------------------------------------------------------------------
# The shared PostgreSQL database. Every server must use the same one.
# ---------------------------------------------------------------------------------------------
database:
  # -- A postgres:// URL. The chart stores it in a Secret of its own. Prefer existingSecret,
  # so that the password is not in your values.
  url: ""
  # -- The name of an existing Secret, in the release namespace, holding the URL.
  existingSecret: ""
  # -- The key in existingSecret that holds the URL.
  existingSecretKey: url

# ---------------------------------------------------------------------------------------------
# The token runners present to servers. Servers and runners read it from the same Secret.
# ---------------------------------------------------------------------------------------------
runnerToken:
  # -- The name of an existing Secret holding the token. If empty, the chart creates a Secret
  # with a random token on first install and keeps the same token on every upgrade.
  existingSecret: ""
  # -- The key in the Secret that holds the token.
  existingSecretKey: token

# ---------------------------------------------------------------------------------------------
# Servers: the API, the web UI and the run engine. They keep nothing that matters on disk;
# any number can run against the same database.
# ---------------------------------------------------------------------------------------------
server:
  # -- Number of servers. Two or more for high availability.
  replicas: 2
  # -- Rolling update settings. maxUnavailable 0 keeps every existing server serving until its
  # replacement is ready.
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # -- How long a stopping server keeps serving, unaware, after Kubernetes takes it out of the
  # Service: the preStop sleep action, before the server is sent SIGTERM. It covers the moment
  # it takes kube-proxy and ingress controllers to stop routing to the pod, so that requests
  # already on their way still succeed. After SIGTERM the server reports not ready on /readyz at
  # once, closes each connection after its current request, waits config.extraConfig.server.
  # drain_delay (default 0s; set it if a load balancer outside Kubernetes checks /readyz), and
  # then gives the requests in flight up to 15s.
  preStopSleepSeconds: 5
  # -- Time allowed for a server to stop, including preStopSleepSeconds and any drain_delay.
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # -- The data directory holds mirrors of the projects' repositories: a cache that is
  # rebuilt when a pod starts. Size it to fit every project's repository.
  dataVolume:
    sizeLimit: 2Gi
  # -- Probes. The startup probe allows time for database migrations, which run when a server
  # starts and are taken in turn under a database lock.
  startupProbe:
    httpGet: { path: /healthz, port: http }
    periodSeconds: 2
    failureThreshold: 90
  livenessProbe:
    httpGet: { path: /healthz, port: http }
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet: { path: /readyz, port: http }
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2
  # -- Spread servers across nodes when the scheduler can (soft: pods still schedule on one
  # node). Ignored if topologySpreadConstraints is set.
  spreadAcrossNodes: true
  # -- Topology spread constraints, replacing the default spread across nodes. Use this to
  # spread across zones as well.
  topologySpreadConstraints: []
  # -- Affinity rules. The default adds a soft anti-affinity between servers.
  affinity: {}
  nodeSelector: {}
  tolerations: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  # -- Extra environment variables for the servers.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  podDisruptionBudget:
    enabled: true
    # -- At most this many servers may be evicted at once (by a node drain, for example).
    maxUnavailable: 1
  serviceAccount:
    # -- Create a ServiceAccount for the servers. It has no API permissions and its token is
    # not mounted.
    create: true
    # -- The name of the ServiceAccount to use (default: <fullname>-server).
    name: ""
    annotations: {}

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  # -- Expose the UI and API through an Ingress. There is no sign-in unless you configure it:
  # do not expose Launchway to an untrusted network.
  enabled: false
  className: ""
  annotations: {}
  # -- Each host routes every path to the servers.
  hosts: []
  #  - launchway.example.com
  tls: []
  #  - secretName: launchway-tls
  #    hosts: [launchway.example.com]

httpRoute:
  # -- Expose the UI and API through a Gateway API HTTPRoute (gateway.networking.k8s.io/v1).
  enabled: false
  annotations: {}
  # -- The Gateways to attach to.
  parentRefs: []
  #  - name: public
  #    namespace: gateway-system
  #    sectionName: https
  hostnames: []

# ---------------------------------------------------------------------------------------------
# Runners: `launchway runner` with the Kubernetes executor. Each run gets one pod in
# runner.kubernetes.namespace, held by one runner: all of a run's steps go to that runner while
# it is alive, so a run's parallel steps share one runner's concurrency. Runners only make
# outbound connections, to the servers and to the Kubernetes API. The chart renders their
# settings into a file, /etc/launchway-runner/runner.yaml, passed with --config.
# ---------------------------------------------------------------------------------------------
runner:
  # -- Deploy runners. Turn off if your runners live elsewhere (they then need the runner
  # token and a URL that reaches the servers).
  enabled: true
  # -- Number of runner pods. A run whose runner is lost has its step run again by another.
  replicas: 2
  # -- Steps each runner executes at once.
  concurrency: 2
  # -- The server URL runners connect to. Default: the chart's Service.
  serverURL: ""
  kubernetes:
    # -- The namespace step pods run in. Default: the release namespace. Runners are granted
    # access to pods in this namespace only. It must exist unless createNamespace is true.
    namespace: ""
    # -- Create the step namespace with the chart (deleted again on uninstall, with any step
    # pods in it).
    createNamespace: false
    # -- Labels for a namespace created by the chart. Step pods meet Pod Security "restricted"
    # unless runner.kubernetes.restricted is false; then use "baseline" here.
    namespaceLabels:
      pod-security.kubernetes.io/enforce: restricted
    # -- The image of each step pod's helper container, which holds the workspace. It needs sh
    # and tar. Default: docker.io/library/busybox:1.37.
    helperImage: ""
    # -- The ServiceAccount step pods run as, in the step namespace. Default: none, and no
    # token is mounted into step pods.
    serviceAccount: ""
    # -- Node selector for step pods (runner.nodeSelector is for the runner pods).
    nodeSelector: {}
    # -- CPU request of each container in a step pod, unless the pipeline asks for its own.
    # Default 50m.
    cpu: ""
    # -- Memory request of each container in a step pod, unless the pipeline asks for its own.
    # Default 64Mi.
    memory: ""
    # -- Memory limit of each container in a step pod that does not ask for memory. Default:
    # none.
    memoryLimit: ""
    # -- Secrets in the step namespace for pulling step images, by name.
    imagePullSecrets: []
    # -- How long a failed or canceled run's pod is kept, so that a resume can reuse its
    # workspace (a Go duration such as 2h). Default 2h.
    keepFailed: ""
    # -- How long to wait for a step pod's images to be pulled and its containers to start.
    # Default 10m.
    startTimeout: ""
    # -- Run every container of a step pod, services included, as runAsUser/runAsGroup rather
    # than as its image's user, with no privilege escalation, no capabilities and the
    # RuntimeDefault seccomp profile, so step pods meet Pod Security "restricted". Each
    # container gets a writable HOME (/home/launchway) and /tmp. Steps that need root, such as
    # `apt-get install`, then fail: use images that already hold their tools. Set false to run
    # images as their own users (often root); the step namespace must then admit that (Pod
    # Security "baseline", see namespaceLabels). Pipelines cannot change this.
    restricted: true
    # -- The user step containers run as when restricted. Not 0 (root).
    # Unset: the built-in default, 1000.
    runAsUser:
    # -- The group step containers run as when restricted; it also owns the pod's volumes.
    # Unset: the built-in default, 1000.
    runAsGroup:
  # -- The port runners serve /healthz (process up) and /readyz (the server answered within two
  # minutes) on, for the probes below. It is not exposed outside the pod.
  healthPort: 8081
  livenessProbe:
    httpGet: { path: /healthz, port: health }
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # -- A runner that cannot reach the servers is not ready, which holds back a rollout that
  # would replace working runners with ones that cannot work.
  readinessProbe:
    httpGet: { path: /readyz, port: health }
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # -- Extra arguments for `launchway runner`. Flags override the settings in the rendered
  # file.
  extraArgs: []
  # -- Secret stores runners may read, the same map as runner.secrets in the server
  # configuration (see the main README); rendered into the runners' file. Mount any token or
  # certificate files they refer to with extraVolumes/extraVolumeMounts. Runners have only the
  # stores defined here: there is no "env" store unless you define one.
  secretStores: {}
  # -- Limits on the report files (test results) runners collect from a step pod after each
  # step. A step's log says when a file was cut short or left out.
  reports:
    # -- Files per step attempt.
    # Unset: the built-in default, 100.
    maxFiles:
    # -- MiB read of one file; a larger one is cut to this.
    # Unset: the built-in default, 10.
    maxFileMiB:
    # -- MiB read of all of a step attempt's files together (and at most what the servers
    # accept: config.tests.maxUploadMiB).
    # Unset: the built-in default, 20.
    maxTotalMiB:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi
  # -- Runners clone each run's commit into this volume and copy it into the step pod.
  dataVolume:
    sizeLimit: 10Gi
  # -- Time allowed for a runner to stop. On SIGTERM it stops its steps (10s grace each) and
  # hands them back to be run again.
  terminationGracePeriodSeconds: 60
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- Spread runners across nodes when the scheduler can (soft).
  spreadAcrossNodes: true
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  serviceAccount:
    # -- Create the runners' ServiceAccount. It is bound to a Role in the step namespace.
    create: true
    # -- The name of the ServiceAccount to use (default: <fullname>-runner).
    name: ""
    annotations: {}
  rbac:
    # -- Create the Role and RoleBinding that let runners manage step pods: pods (create, get,
    # list, delete, patch), pods/exec (create, get) and pods/log (get), in the step namespace
    # only.
    create: true

# Security settings shared by servers and runners. The image runs as user 65532.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# ---------------------------------------------------------------------------------------------
# A development PostgreSQL, for trying the chart only: one pod, no backups, no high
# availability, no tuning. Use a managed or operator-run PostgreSQL in production and set
# database.* instead.
# ---------------------------------------------------------------------------------------------
postgresql:
  enabled: false
  image:
    repository: docker.io/library/postgres
    tag: 17.12-alpine
    pullPolicy: IfNotPresent
  database: launchway
  username: launchway
  # -- If empty, a random password is generated once and kept across upgrades.
  password: ""
  persistence:
    size: 1Gi
    # -- The StorageClass for the volume (default: the cluster's default).
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# ---------------------------------------------------------------------------------------------
# Delivery: deploy and rollback steps (pipelines with kind: deploy). Off unless set. A deploy
# step commits a version to a GitOps repository, asks Argo CD to sync if it must, and waits
# until the application (and its Argo Rollouts rollout) is healthy. The deploy runner below
# does that work with its own Kubernetes identity; the servers hold no cluster credentials.
# Set these only once every server and runner runs a release that knows them, and take them
# out again before rolling back to one that does not.
# ---------------------------------------------------------------------------------------------
delivery:
  # -- Environments deploy steps may deploy to, written into the servers' configuration only
  # when set. Default: none, and deploy steps are refused. Example:
  #   - name: prod
  #     target: homelab          # the cluster: deployRunner.target serves it
  #     projects: [shop, "mcp-*"]
  #     queue: newest            # or all; default newest
  environments: null
  deployRunner:
    # -- Run a deploy runner in this cluster, with a runner pool token of its own. It serves
    # deployRunner.target, which must be this cluster.
    enabled: false
    # -- The target this cluster is, as delivery.environments names it.
    target: ""
    replicas: 1
    # -- Where the Argo CD Applications are.
    argocdNamespace: argocd
    # -- Which projects may deploy which applications. Names must be written out (no
    # patterns): the RBAC rules name each application.
    #   - { projects: [shop], names: [shop] }
    applications: []
    # -- Namespaces whose Argo Rollouts rollouts deploy steps may watch.
    rolloutNamespaces: []
    # -- GitOps repositories deploy steps may commit to, by name: the same map as deploy.repos
    # in a deploy runner's file (url, argocd_url, credentials, username, paths, author).
    # Credentials name a secret in secretStores, never a value.
    repos: {}
    # -- Secret stores the deploy runner may read (as runner.secretStores).
    secretStores: {}
    # -- Ask Argo CD to look at the repository at once after a commit (the refresh
    # annotation). Default (unset): true.
    refresh: null
    rbac:
      # -- Create the Roles below and bind them to the deploy runner.
      create: true
      # -- Grant patch on the named Applications, needed to request syncs and refreshes. With
      # automated sync and a Git webhook it may be turned off (deploy steps then need
      # sync.request: auto or never). The admission policy below limits what the patch may
      # change.
      patchApplications: true
      # -- Grant get on Deployments in the rollout namespaces, needed only for rollouts that
      # take their pod template from a Deployment (workloadRef). Off by default: a Deployment
      # holds its pod spec.
      readDeployments: false
    # -- A ValidatingAdmissionPolicy (Kubernetes 1.30 or newer) letting the deploy runner change
    # only an Application's operation and refresh annotation, never its spec.
    admissionPolicy:
      enabled: true
    # -- The pool token. Generated on first install and kept on upgrade, unless an existing
    # Secret is named.
    poolToken:
      existingSecret: ""
      existingSecretKey: token
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    healthPort: 8081
    nodeSelector: {}
    tolerations: []
    podAnnotations: {}
    extraEnv: []
    extraVolumes: []
    extraVolumeMounts: []
