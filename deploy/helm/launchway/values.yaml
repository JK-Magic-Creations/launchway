# Default values for the Launchway chart. See deploy/README.md for a walk-through and
# examples/ha.yaml for a production-shaped example.
#
# One of these is required, or the install fails:
#   database.url, database.existingSecret, or postgresql.enabled=true (for trying the chart only).

# -- Overrides the chart name in resource names.
nameOverride: ""
# -- Overrides the full resource name prefix (default: <release>-launchway).
fullnameOverride: ""
# -- Labels added to every resource the chart creates.
commonLabels: {}

image:
  # -- The Launchway image; servers and runners use the same one.
  repository: ghcr.io/jk-magic-creations/launchway
  # -- The image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- An image digest (sha256:...). When set it is used instead of the tag.
  digest: ""
  pullPolicy: IfNotPresent

# -- Secrets for pulling the Launchway (and development PostgreSQL) image, by name.
imagePullSecrets: []

# ---------------------------------------------------------------------------------------------
# The server configuration file.
#
# SINCE SCHEMA 23 THE FILE IS BOOTSTRAP ONLY. Everything an administrator manages (projects,
# libraries, environments, runner pools, role bindings, policies, health sources, models, secret
# stores, limits, the MCP endpoint, where artifacts are kept) lives in the database, with history
# and an API, the web UI, the CLI and the MCP server. What the values below set for those is
# IMPORTED ONCE, by the first server of a new installation to start, and ignored afterwards: each
# server logs which keys it ignores and names the import. After that, change them in the UI,
# `launchway config`, the API or Terraform, not here; `launchway config export` writes them as
# text for backup or Git. The chart writes these keys only when you set them, so with the
# default values the file holds only listen, data and the runner switch. docs/reference/server-config.md
# lists what stays in the file (docs/concepts: configuration).
#
# The chart renders the file into a ConfigMap mounted at
# /etc/launchway/launchway.yaml; changing it restarts the servers. The database URL and the
# runner token are never written here: they reach the servers as environment variables from
# Secrets. Servers always run with their built-in runner disabled; steps run on the runners
# below.
# ---------------------------------------------------------------------------------------------
# A NOTE ON DEFAULTS. Settings that newer versions added are left unset here and take the
# program's built-in default, so that the configuration this chart writes by default can still be
# read by the version before it: during an upgrade, and after an aborted one, pods of both
# versions read the same ConfigMap, and a server refuses a setting it does not know.
config:
  # -- Address the servers listen on, inside the pod. The port is also the container port.
  listen: 0.0.0.0:8080
  # -- Repositories to watch. Each needs a URL the servers and runners can clone
  # (https://... or ssh://...). Example:
  #   - name: payments
  #     repo: https://git.example.com/team/payments.git
  #     branch: main     # default branch for manual runs
  #     poll: 30s        # how often to look for pushes
  #     # Optional: let the pipeline editor commit to the repository, with the servers'
  #     # Git credentials (in the URL, or GIT_CONFIG_* variables in server.extraEnv).
  #     push: { branch_prefix: launchway/, allow_direct: [] }
  #     # Optional: who may start draft runs of unsaved pipeline text here (overrides
  #     # drafts: in extraConfig).
  #     drafts: { allow: admin, secrets: false }
  #     # Optional: let steps of pull-request runs read secrets here (overrides
  #     # pull_requests: in extraConfig; the default is no).
  #     pull_requests: { secrets: false }
  #     # Optional: turn this project's schedules off (overrides config.schedules.enabled).
  #     schedules: { enabled: false }
  #     # Optional: the Git host's webhook, which makes the servers poll at once. The secret
  #     # comes from an environment variable (server.extraEnv, from a Secret) or a file.
  #     git_webhook: { kind: github, secret_env: PAYMENTS_HOOK_SECRET }
  #     # Optional: what callers of the pipeline's webhook triggers must prove, by name:
  #     # one of token_env, token_file, hmac_secret_env, hmac_secret_file.
  #     webhooks:
  #       deploy-request: { hmac_secret_env: PAYMENTS_DEPLOY_HMAC }
  projects: []
  # -- What the servers keep of the test reports steps declare (reports.tests in a pipeline).
  # Each step attempt's summary is kept with the run's events; individual results go in a table
  # of their own, within these limits.
  tests:
    # -- MiB of report files a server accepts for one step attempt. Runners are told, and
    # collect no more; a result larger than this is refused and reported without its files.
    # Unset: the built-in default, 24.
    maxUploadMiB:
    # -- Individual test results one run keeps; beyond this only the totals are kept.
    # Unset: the built-in default, 50000.
    maxCasesPerRun:
    # -- Individual test results a project keeps over all its runs. When there are more, the
    # oldest runs' results are removed first (their totals stay). At least maxCasesPerRun.
    # Unset: the built-in default, 1000000.
    maxCasesPerProject:
  # -- Where the files steps keep (artifacts: in a pipeline, and SBOMs) are stored, and limits on
  # them. Every setting is unset by default, and only written to the configuration when set (a
  # server of the version before does not know them; see docs/development/migrations.md).
  # Unset, with PostgreSQL (postgresql.enabled or an external database), artifacts are kept in the
  # database itself, in chunks, shared by every server: nothing else to run (docs/artifacts.md).
  # With SQLite they go in the pod's data directory. An installation that kept artifacts on the
  # filesystem before the database store existed keeps doing so, and the servers' log says how to
  # copy them into the database (launchway blobs copy). For very large or busy installations set
  # store: s3 and point it at a bucket all servers share.
  artifacts:
    # -- database, filesystem or s3. Unset: database on PostgreSQL, filesystem on SQLite.
    # Set database only once every server runs a release that knows it (see
    # docs/development/migrations.md, schema 17).
    store:
    # -- Limits of the database store. Unset: the built-in defaults shown.
    database:
      # -- How much the store may hold in all, in GiB, uploads in progress included. Unset: 100.
      maxTotalGiB:
      # -- The largest single file, in MiB. Unset: 2048.
      maxBlobMiB:
    s3:
      # -- The endpoint, scheme and host only, such as https://s3.eu-west-1.amazonaws.com or
      # http://minio.storage:9000.
      endpoint:
      # -- Unset: us-east-1.
      region:
      bucket:
      # -- Prepended to every object's name, such as launchway/.
      prefix:
      # -- Path-style requests (bucket in the path). Unset: true, which MinIO, Ceph and AWS accept.
      pathStyle:
      # -- A Secret with the keys AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (and optionally
      # AWS_SESSION_TOKEN), given to the servers as environment variables. Credentials are never in
      # the ConfigMap.
      existingSecret:
    # -- The largest file an artifact may hold, in MiB. Unset: 1024.
    maxFileMiB:
    # -- How much one run may keep, in MiB. Unset: 4096.
    maxRunMiB:
    # -- How much a project may keep over all its runs, in GiB. Unset: 50.
    maxProjectGiB:
    # -- How long artifacts are kept when the pipeline does not say (30d, 2w, 12h). Unset: 30d.
    retain:
    # -- The longest any artifact is kept, whatever the pipeline says. Unset: 90d.
    maxRetain:
  # -- What the servers keep of security findings (reports.findings, SARIF) and SBOMs
  # (reports.sbom). Unset values take the built-in defaults shown.
  findings:
    # -- MiB of SARIF files a server accepts for one step attempt. Unset: 32.
    maxUploadMiB:
    # -- Findings one run keeps; beyond this only the counts. Unset: 20000.
    maxPerRun:
    # -- Findings a project keeps over all its runs, oldest runs' removed first. Unset: 500000.
    maxPerProject:
    # -- SBOM components one run keeps for searching. Unset: 20000.
    maxComponentsPerRun:
    # -- SBOM components a project keeps. Unset: 1000000.
    maxComponentsPerProject:
    # -- MiB of a step's SBOM files read to summarize them (they are kept whole anyway). Unset: 64.
    maxSbomMiB:
  # -- Test attachments, coverage and HTML reports (reports.tests.attachments, reports.coverage,
  # reports.html). Unset values take the built-in defaults shown, and are not written to the
  # configuration, so the release before this one can still read it. Set them only once every
  # server is upgraded.
  reports:
    # -- Files a step's attachments directory may hold; it is kept whole or not at all. Unset: 2000.
    maxAttachmentFiles:
    # -- MiB a step's attachments directory may hold. Unset: 512.
    maxAttachmentMiB:
    # -- Files one HTML report may hold. Unset: 5000.
    maxHtmlFiles:
    # -- MiB one HTML report may hold. Unset: 256.
    maxHtmlMiB:
    # -- MiB of coverage reports a server accepts for one step attempt. Unset: 24.
    maxCoverageUploadMiB:
    # -- Source files' coverage one run keeps; beyond it only the totals. Unset: 20000.
    maxCoverageFilesPerRun:
    # -- Source files' coverage a project keeps; the oldest runs' go first. Unset: 2000000.
    maxCoverageFilesPerProject:
    # -- A separate origin that alone serves hosted HTML reports, such as
    # https://reports.ci.example.com: a host name of its own routed to the same servers (add it to
    # the ingress). Unset: reports are served from Launchway's own origin, sandboxed.
    origin:
  # -- Loops in pipelines (for_each).
  loops:
    # -- Combinations one loop may have; a run whose loop has more is refused.
    # Unset: the built-in default, 64 (at most 500).
    maxMembers:
  # -- Schedules in pipelines (on.schedule).
  schedules:
    # -- false turns every project's schedules off (a project's schedules: setting may turn
    # its own back on); their firings are recorded as skipped.
    # Unset: the built-in default, on.
    enabled:
  # -- API tokens.
  tokens:
    # -- The longest an API token may last, in days. Written as auth.tokens.max_days.
    # Unset: the built-in default, 365 (at most 3650).
    maxDays:
  # -- Delivery policies (schema 16): rules pipelines cannot opt out of. Written to the
  # configuration only when set, as policy: (see the README's Policies section). Set it only
  # once every server runs a release that knows policies, and take it out before rolling back.
  # Unset: no policies. For example:
  #   policy:
  #     waivers: { allow: admin, maxDays: 30 }      # the built-in defaults
  #     sources:                                     # Git sources, from config.extraConfig.libraries
  #       - { name: org, library: org-policies, version: v3, path: policies, refresh: 1m, staleAfter: 1h }
  #     policies:
  #       - name: prod-evidence
  #         mode: enforce
  #         scope: { environments: [prod] }
  #         rules: { tests: { min: 1 }, approvals: { min: 1 } }
  policy:
  # -- The MCP endpoint (/mcp), through which agents use Launchway with API tokens. It is on by
  # default, in every server: it gives a token no right it does not already have over the API.
  # Every setting is unset by default, and only written to the configuration when set (a server
  # of the version before does not know mcp:; see docs/development/migrations.md).
  mcp:
    # -- false turns the endpoint off on every server. Unset: on.
    enabled:
    # -- Origins of web pages, besides the servers' own, that may call /mcp from a browser, such
    # as https://tools.example.com. Requests without an Origin header are not affected.
    allowedOrigins: []
    # -- Requests one token may make to /mcp per minute, on each server. Unset: 120.
    requestsPerMinute:
    # -- Requests one token may have in progress at once, on each server. Unset: 4.
    concurrent:
    # -- MCP requests in progress at once on each server, all tokens together. Unset: 32.
    total:
    # -- Also accept the sign-in provider's OAuth access tokens issued for /mcp (needs
    # auth.mode: oidc in extraConfig). resource is this endpoint's address as clients reach it,
    # such as https://launchway.example.com/mcp; scopes, if any, must all be granted.
    oauth:
      resource:
      scopes: []
  # -- Runner pools (schemas 20 and 21), written as runner_pools: in the configuration's own
  # keys, after the deploy pool delivery.* makes. Unset: none; every build runner is in the
  # default pool, which serves every project. Set it only once every server and runner runs a
  # release that knows it, and take it out before rolling back. For example:
  #   runnerPools:
  #     - { name: web, kind: build, projects: ["web-*"] }
  #     - { name: default, kind: build, projects: ["*"], require_identity: true }
  runnerPools:
  # -- The role needed on every project to make join tokens and to revoke or rotate runners:
  # admin, operator or none. Written as runner_admin only when set. Unset: admin.
  runnerAdmin:
  # -- Any other top-level settings, merged into the file as they are, so that new settings
  # need no chart change. For example:
  #   user: ci-admin
  #   approvals: { allow_self: false }
  #   drafts: { allow: operator, secrets: false }   # the defaults
  #   pull_requests: { secrets: false }             # the default
  # The server rejects settings it does not know, so a typo here stops the servers from
  # starting (the pod logs say which key). listen, data, database, projects, tests, artifacts, reports,
  # findings, loops, schedules, policy, mcp, verification (delivery.verification) and ai (ai.*) are
  # set by the chart and may not appear here; runner.enabled may not be true.
  extraConfig: {}

# ---------------------------------------------------------------------------------------------
# The shared PostgreSQL database. Every server must use the same one.
# ---------------------------------------------------------------------------------------------
database:
  # -- A postgres:// URL. The chart stores it in a Secret of its own. Prefer existingSecret,
  # so that the password is not in your values.
  url: ""
  # -- The name of an existing Secret, in the release namespace, holding the URL.
  existingSecret: ""
  # -- The key in existingSecret that holds the URL.
  existingSecretKey: url

# ---------------------------------------------------------------------------------------------
# The token runners present to servers. Servers and runners read it from the same Secret.
# ---------------------------------------------------------------------------------------------
runnerToken:
  # -- The name of an existing Secret holding the token. If empty, the chart creates a Secret
  # with a random token on first install and keeps the same token on every upgrade.
  existingSecret: ""
  # -- The key in the Secret that holds the token.
  existingSecretKey: token

# ---------------------------------------------------------------------------------------------
# Servers: the API, the web UI and the run engine. They keep nothing that matters on disk;
# any number can run against the same database.
# ---------------------------------------------------------------------------------------------
server:
  # -- Number of servers. Two or more for high availability.
  replicas: 2
  # -- Rolling update settings. maxUnavailable 0 keeps every existing server serving until its
  # replacement is ready.
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # -- How long a stopping server keeps serving, unaware, after Kubernetes takes it out of the
  # Service: the preStop sleep action, before the server is sent SIGTERM. It covers the moment
  # it takes kube-proxy and ingress controllers to stop routing to the pod, so that requests
  # already on their way still succeed. After SIGTERM the server reports not ready on /readyz at
  # once, closes each connection after its current request, waits config.extraConfig.server.
  # drain_delay (default 0s; set it if a load balancer outside Kubernetes checks /readyz), and
  # then gives the requests in flight up to 15s.
  preStopSleepSeconds: 5
  # -- Time allowed for a server to stop, including preStopSleepSeconds and any drain_delay.
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # -- The data directory holds mirrors of the projects' repositories: a cache that is
  # rebuilt when a pod starts. Size it to fit every project's repository.
  dataVolume:
    sizeLimit: 2Gi
  # -- Probes. The startup probe allows time for database migrations, which run when a server
  # starts and are taken in turn under a database lock.
  startupProbe:
    httpGet: { path: /healthz, port: http }
    periodSeconds: 2
    failureThreshold: 90
  livenessProbe:
    httpGet: { path: /healthz, port: http }
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet: { path: /readyz, port: http }
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2
  # -- Spread servers across nodes when the scheduler can (soft: pods still schedule on one
  # node). Ignored if topologySpreadConstraints is set.
  spreadAcrossNodes: true
  # -- Topology spread constraints, replacing the default spread across nodes. Use this to
  # spread across zones as well.
  topologySpreadConstraints: []
  # -- Affinity rules. The default adds a soft anti-affinity between servers.
  affinity: {}
  nodeSelector: {}
  tolerations: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  # -- Extra environment variables for the servers.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  podDisruptionBudget:
    enabled: true
    # -- At most this many servers may be evicted at once (by a node drain, for example).
    maxUnavailable: 1
  serviceAccount:
    # -- Create a ServiceAccount for the servers. It has no API permissions and its token is
    # not mounted.
    create: true
    # -- The name of the ServiceAccount to use (default: <fullname>-server).
    name: ""
    annotations: {}

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Git over SSH, served by the servers themselves (installation setting forge.ssh.listen, which must be
# ":<port>" with the port below). Off by default. This opens the port and makes a Service for it; to
# publish it, make the Service a LoadBalancer or route TCP to it from a Gateway (docs/reference/helm-values.md).
ssh:
  # -- Open the SSH port on the servers and make a Service for it.
  enabled: false
  # -- The port the servers listen on inside the pod; forge.ssh.listen must be ":<this port>".
  port: 2222
  service:
    # -- ClusterIP, NodePort or LoadBalancer.
    type: ClusterIP
    # -- The port the Service offers (22 makes clone addresses git@host:owner/name.git).
    port: 22
    annotations: {}

ingress:
  # -- Expose the UI and API through an Ingress. There is no sign-in unless you configure it:
  # do not expose Launchway to an untrusted network.
  enabled: false
  className: ""
  annotations: {}
  # -- Each host routes every path to the servers.
  hosts: []
  #  - launchway.example.com
  tls: []
  #  - secretName: launchway-tls
  #    hosts: [launchway.example.com]

httpRoute:
  # -- Expose the UI and API through a Gateway API HTTPRoute (gateway.networking.k8s.io/v1).
  enabled: false
  annotations: {}
  # -- The Gateways to attach to.
  parentRefs: []
  #  - name: public
  #    namespace: gateway-system
  #    sectionName: https
  hostnames: []

# ---------------------------------------------------------------------------------------------
# Runners: `launchway runner` with the Kubernetes executor. Each run gets one pod in
# runner.kubernetes.namespace, held by one runner: all of a run's steps go to that runner while
# it is alive, so a run's parallel steps share one runner's concurrency. Runners only make
# outbound connections, to the servers and to the Kubernetes API. The chart renders their
# settings into a file, /etc/launchway-runner/runner.yaml, passed with --config.
# ---------------------------------------------------------------------------------------------
runner:
  # -- Deploy runners. Turn off if your runners live elsewhere (they then need the runner
  # token and a URL that reaches the servers).
  enabled: true
  # -- Number of runner pods. A run whose runner is lost has its step run again by another.
  replicas: 2
  # -- Steps each runner executes at once.
  concurrency: 2
  # -- The server URL runners connect to. Default: the chart's Service.
  serverURL: ""
  # -- Enrol each runner pod with a join token instead of using the shared runner token
  # (schema 20): a Secret holding a join token made in the UI (Runners, Add a runner) with
  # enough uses for every pod start, ideally ephemeral. Unset: the shared runner token.
  #   join: { existingSecret: launchway-runner-join, existingSecretKey: token }
  join:
  # -- Labels the runners have, for pipelines that ask for them (runner: { labels }). Written
  # only when set. Unset: none.
  labels:
  # -- The runners' own limits on the work they take (accept: in runner.yaml), checked on the
  # runner before anything runs. Written only when set; see docs/guide/runner-identity.md
  # ("What a runner trusts the server with"). Unset: no limits. For example:
  #   accept: { projects: [shop], images: ["registry.example.com/*"], pull_requests: false }
  accept:
  kubernetes:
    # -- The namespace step pods run in. Default: the release namespace. Runners are granted
    # access to pods in this namespace only. It must exist unless createNamespace is true.
    namespace: ""
    # -- Create the step namespace with the chart (deleted again on uninstall, with any step
    # pods in it).
    createNamespace: false
    # -- Labels for a namespace created by the chart. Step pods meet Pod Security "restricted"
    # unless runner.kubernetes.restricted is false; then use "baseline" here.
    namespaceLabels:
      pod-security.kubernetes.io/enforce: restricted
    # -- The image of each step pod's helper container, which holds the workspace. It needs sh
    # and tar. Default: docker.io/library/busybox:1.37.
    helperImage: ""
    # -- The ServiceAccount step pods run as, in the step namespace. Default: none, and no
    # token is mounted into step pods.
    serviceAccount: ""
    # -- Node selector for step pods (runner.nodeSelector is for the runner pods).
    nodeSelector: {}
    # -- CPU request of each container in a step pod, unless the pipeline asks for its own.
    # Default 50m.
    cpu: ""
    # -- Memory request of each container in a step pod, unless the pipeline asks for its own.
    # Default 64Mi.
    memory: ""
    # -- Memory limit of each container in a step pod that does not ask for memory. Default:
    # none.
    memoryLimit: ""
    # -- The most CPU one container of a step pod may ask for, as a request or a limit. The
    # server's step resource defaults are lowered to it; a step that asks for more fails before
    # its pod is made. Default: no cap.
    maxCpu: ""
    # -- The most memory one container of a step pod may ask for, as a request or a limit. The
    # server's step resource defaults are lowered to it; a step that asks for more fails before
    # its pod is made. Default: no cap.
    maxMemory: ""
    # -- Secrets in the step namespace for pulling step images, by name.
    imagePullSecrets: []
    # -- A grace period before a failed or canceled run's pod is removed (a Go duration such as
    # 10m). Default 0: the pod goes as soon as the run ends, because a running pod holds
    # namespace quota; a resume refills a new pod from the runner's checkout. See the runner
    # configuration reference, "What happens to a run's pod".
    keepFailed: ""
    # -- The longest any step pod lives, whatever the server says about its run, unless a step
    # of it is executing on that runner: the reaper's bound for pods that a crashed runner or a
    # forgotten run left behind. Default 24h; 0 turns the bound off.
    maxPodAge: ""
    # -- How long to wait for a step pod's images to be pulled and its containers to start.
    # Default 10m.
    startTimeout: ""
    # -- Run every container of a step pod, services included, as runAsUser/runAsGroup rather
    # than as its image's user, with no privilege escalation, no capabilities and the
    # RuntimeDefault seccomp profile, so step pods meet Pod Security "restricted". Each
    # container gets a writable HOME (/home/launchway) and /tmp. Steps that need root, such as
    # `apt-get install`, then fail: use images that already hold their tools. Set false to run
    # images as their own users (often root); the step namespace must then admit that (Pod
    # Security "baseline", see namespaceLabels). Pipelines cannot change this.
    restricted: true
    # -- The user step containers run as when restricted. Not 0 (root).
    # Unset: the built-in default, 1000.
    runAsUser:
    # -- The group step containers run as when restricted; it also owns the pod's volumes.
    # Unset: the built-in default, 1000.
    runAsGroup:
  # -- The port runners serve /healthz (process up) and /readyz (the server answered within two
  # minutes) on, for the probes below. It is not exposed outside the pod.
  healthPort: 8081
  livenessProbe:
    httpGet: { path: /healthz, port: health }
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # -- A runner that cannot reach the servers is not ready, which holds back a rollout that
  # would replace working runners with ones that cannot work.
  readinessProbe:
    httpGet: { path: /readyz, port: health }
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # -- Extra arguments for `launchway runner`. Flags override the settings in the rendered
  # file.
  extraArgs: []
  # -- Secret stores runners may read, the same map as runner.secrets in the server
  # configuration (see the main README); rendered into the runners' file. Mount any token or
  # certificate files they refer to with extraVolumes/extraVolumeMounts. Runners have only the
  # stores defined here: there is no "env" store unless you define one.
  secretStores: {}
  # -- Limits on the report files (test results) runners collect from a step pod after each
  # step. A step's log says when a file was cut short or left out.
  reports:
    # -- Files per step attempt.
    # Unset: the built-in default, 100.
    maxFiles:
    # -- MiB read of one file; a larger one is cut to this.
    # Unset: the built-in default, 10.
    maxFileMiB:
    # -- MiB read of all of a step attempt's files together (and at most what the servers
    # accept: config.tests.maxUploadMiB).
    # Unset: the built-in default, 20.
    maxTotalMiB:
  # -- Image steps (kind: image). Runners build images on BuildKit daemons you run apart from
  # the step pods (deploy/buildkit/buildkitd.yaml: rootless BuildKit cannot run under Pod
  # Security "restricted"), push them to the registries named here, and sign them. Unset (no
  # builders), runners take no image steps and the runners' file has no images section, so the
  # release before this one can read it. Set it only once every runner is upgraded.
  images:
    # -- The BuildKit daemons, each { name, address: tcp://host:1234, serverName, platforms,
    # projects }. The runners' client certificate and the daemons' CA come from tlsSecret.
    builders: []
    # -- A Secret with ca.crt (the CA that signed the daemons' certificates), tls.crt and
    # tls.key (the runners' client certificate), mounted at /var/run/launchway/buildkit.
    tlsSecret: ""
    # -- Registries by the name pipelines use: { host, credentials: { username, password: {
    # store, key, field } }, pullCredentials, caFile, insecure, push: [ { projects,
    # repositories } ], pullProjects: [ ... ] }. Credentials are secret references read from
    # runner.secretStores. pullCredentials go to the builds of the projects in pullProjects (empty:
    # every project), and to pull requests only when they may read secrets.
    # Mount a CA file with extraVolumes and name its path in caFile.
    registries: {}
    # -- A Secret with the runners' own cosign key (cosign.key, and cosign.password if it is
    # encrypted), for steps that say sign: true. Mounted at /var/run/launchway/signing, which
    # step pods never see. Unset: sign: true fails, saying the runner has no key.
    signingSecret: ""
    # -- The scanner image (pinned by digest) and where it downloads its databases from.
    # Unset: the built-in Trivy, from its public database repositories.
    scanner:
      image: ""
      dbRepository: ""
      javaDBRepository: ""
    # -- MiB of build context a step may send. Unset: the built-in default, 2048.
    maxContextMiB:
    # -- MiB of image the runner accepts back from a builder. Unset: the built-in default, 20480.
    maxImageMiB:
  # -- Let runners take ai steps, calling the models in ai.models. A model's key is read from
  # runner.secretStores. Written to the runners' file only when true; needs ai.models.
  # Unset: the built-in default, false (runners call no model).
  ai:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi
  # -- Runners clone each run's commit into this volume and copy it into the step pod.
  dataVolume:
    sizeLimit: 10Gi
  # -- Time allowed for a runner to stop. On SIGTERM it stops its steps (10s grace each) and
  # hands them back to be run again.
  terminationGracePeriodSeconds: 60
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- Spread runners across nodes when the scheduler can (soft).
  spreadAcrossNodes: true
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  serviceAccount:
    # -- Create the runners' ServiceAccount. It is bound to a Role in the step namespace.
    create: true
    # -- The name of the ServiceAccount to use (default: <fullname>-runner).
    name: ""
    annotations: {}
  rbac:
    # -- Create the Role and RoleBinding that let runners manage step pods: pods (create, get,
    # list, delete, patch), pods/exec (create, get) and pods/log (get), in the step namespace
    # only.
    create: true

# Security settings shared by servers and runners. The image runs as user 65532.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# ---------------------------------------------------------------------------------------------
# A development PostgreSQL, for trying the chart only: one pod, no backups, no high
# availability, no tuning. Use a managed or operator-run PostgreSQL in production and set
# database.* instead.
# ---------------------------------------------------------------------------------------------
postgresql:
  enabled: false
  image:
    repository: docker.io/library/postgres
    tag: 17.12-alpine
    pullPolicy: IfNotPresent
  database: launchway
  username: launchway
  # -- If empty, a random password is generated once and kept across upgrades.
  password: ""
  persistence:
    size: 1Gi
    # -- The StorageClass for the volume (default: the cluster's default).
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# ---------------------------------------------------------------------------------------------
# Delivery: deploy and rollback steps (pipelines with kind: deploy). Off unless set. A deploy
# step commits a version to a GitOps repository, asks Argo CD to sync if it must, and waits
# until the application (and its Argo Rollouts rollout) is healthy. The deploy runner below
# does that work with its own Kubernetes identity; the servers hold no cluster credentials.
# Set these only once every server and runner runs a release that knows them, and take them
# out again before rolling back to one that does not.
# ---------------------------------------------------------------------------------------------
delivery:
  # -- Environments deploy steps may deploy to, written into the servers' configuration only
  # when set. Default: none, and deploy steps are refused. Example:
  #   - name: prod
  #     target: homelab          # the cluster: deployRunner.target serves it
  #     projects: [shop, "mcp-*"]
  #     queue: newest            # or all; default newest
  #     protected: true          # the person who started a run may not promote it here; default false
  environments: null
  # -- Health sources: where verify steps read metrics and logs to judge a deployment. Each entry
  # is split: name, type and projects go to the servers' verification.sources, and the whole
  # entry to the deploy runner's health_sources, by name. Needs deployRunner.enabled: the deploy
  # runner does the queries. Credentials are only secret references, read from
  # deployRunner.secretStores. Default (unset): none, and verify steps are refused.
  #
  # Each source: { name, type, url, projects, and optionally auth, headers, caFile, timeout,
  # limits, statements, indices, timeField, messageField }.
  #   type: prometheus (also Thanos, Mimir, VictoriaMetrics), loki, clickhouse, elasticsearch,
  #     opensearch, postgres or http.
  #   projects: patterns of the projects that may use it; at least one.
  #   auth: { type: bearer|basic|header, user, header, secret: { store, key, field } }; for
  #     clickhouse and postgres type may be left out (user and secret are the database login).
  #   headers: fixed headers that are not secret, such as X-Scope-OrgID.
  #   caFile: a PEM file of extra CAs, mounted with deployRunner.extraVolumes.
  #   timeout: per query; default 10s, at most 60s.
  #   limits: { maxSeries, maxPoints, maxLines, maxBytes }; defaults 1, 500, 5000, 8 MiB.
  #   statements: (clickhouse, postgres, http) the only queries pipelines may run there, by name:
  #     { kind: metric|logs, sql, path, method, body, value, params, projects }.
  #   indices, timeField, messageField: (elasticsearch) the indices pipelines may search, and the
  #     documents' time and message fields (default @timestamp and message).
  # Sources in the cluster need no RBAC. The chart renders no NetworkPolicy; if the deploy
  # runner's namespace denies egress by default, allow it to reach each source's host and port.
  # Example:
  #   sources:
  #     - name: prometheus
  #       type: prometheus
  #       url: http://prometheus-operated.monitoring.svc:9090
  #       projects: ["*"]
  #     - name: loki
  #       type: loki
  #       url: http://loki-gateway.monitoring.svc
  #       projects: [shop, "mcp-*"]
  #       headers: { X-Scope-OrgID: homelab }
  #       limits: { maxLines: 2000 }
  #     - name: clickhouse
  #       type: clickhouse
  #       url: http://clickhouse.analytics.svc:8123
  #       projects: [shop]
  #       auth: { user: launchway, secret: { store: vault, key: ci/clickhouse, field: password } }
  #       timeout: 20s
  #       statements:
  #         checkout_errors:
  #           kind: metric
  #           sql: >-
  #             SELECT toStartOfMinute(ts) AS t, countIf(status >= 500) / count() AS value
  #             FROM requests WHERE service = {service:String}
  #             AND ts BETWEEN {start:DateTime64(3)} AND {end:DateTime64(3)} GROUP BY t ORDER BY t
  #           params: { service: String }
  verification:
    sources: null
  deployRunner:
    # -- Run a deploy runner in this cluster, with a runner pool token of its own. It serves
    # deployRunner.target, which must be this cluster.
    enabled: false
    # -- The target this cluster is, as delivery.environments names it.
    target: ""
    replicas: 1
    # -- Where the Argo CD Applications are.
    argocdNamespace: argocd
    # -- Which projects may deploy which applications. Names must be written out (no
    # patterns): the RBAC rules name each application.
    #   - { projects: [shop], names: [shop] }
    applications: []
    # -- Namespaces whose Argo Rollouts rollouts deploy steps may watch.
    rolloutNamespaces: []
    # -- GitOps repositories deploy steps may commit to, by name: the same map as deploy.repos
    # in a deploy runner's file (url, argocd_url, credentials, username, paths, author).
    # Credentials name a secret in secretStores, never a value.
    repos: {}
    # -- Secret stores the deploy runner may read (as runner.secretStores).
    secretStores: {}
    # -- Ask Argo CD to look at the repository at once after a commit (the refresh
    # annotation). Default (unset): true.
    refresh: null
    # -- Let the deploy runner call the models in ai.models to explain its verdicts, with keys
    # read from deployRunner.secretStores. Written to its file only when true; needs ai.models.
    # Unset: the built-in default, false.
    ai: null
    # -- The deploy runner's own limits on the work it takes (accept: in its runner.yaml), checked
    # on the runner before anything runs: which projects it serves and which environments it
    # deploys to. Written only when set. For example:
    #   accept: { projects: [launchway], environments: [launchway-dev, launchway-sandbox], executors: [deploy] }
    accept: null
    rbac:
      # -- Create the Roles below and bind them to the deploy runner.
      create: true
      # -- Grant patch on the named Applications, needed to request syncs and refreshes. With
      # automated sync and a Git webhook it may be turned off (deploy steps then need
      # sync.request: auto or never). The admission policy below limits what the patch may
      # change.
      patchApplications: true
      # -- Grant get on Deployments in the rollout namespaces, needed only for rollouts that
      # take their pod template from a Deployment (workloadRef). Off by default: a Deployment
      # holds its pod spec.
      readDeployments: false
      # -- Grant get and list on pods and get on pods/log in the rollout namespaces, so that the
      # run page can show the end of a failed analysis job's log and the pods of a rollout. Off
      # by default: logs can hold anything a job prints.
      readPods: false
      # -- Rollouts the deploy runner may promote, abort and retry (rollout steps, the run
      # page's buttons, abort_first, on_cancel: abort), by namespace; each namespace must be in
      # rolloutNamespaces. Grants patch on rollouts/status for exactly these names; the
      # admission policy keeps the patch to the fields those commands set. Default (unset):
      # none, and commands are not applied (the runner reports that it may not).
      #   shop: [shop]
      controlRollouts: null
    # -- A ValidatingAdmissionPolicy (Kubernetes 1.30 or newer) letting the deploy runner change
    # only an Application's operation and refresh annotation, never its spec.
    admissionPolicy:
      enabled: true
    # -- The pool token. Generated on first install and kept on upgrade, unless an existing
    # Secret is named.
    poolToken:
      existingSecret: ""
      existingSecretKey: token
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    healthPort: 8081
    nodeSelector: {}
    tolerations: []
    podAnnotations: {}
    extraEnv: []
    extraVolumes: []
    extraVolumeMounts: []

# ---------------------------------------------------------------------------------------------
# AI: the models steps may ask (ai steps, and explanations of failed steps and verdicts). Off
# unless set: with no model, nothing is ever sent to one and every other feature works. Set these
# only once every server and runner runs a release that knows them, and take them out again
# before rolling back to one that does not. Runners and the deploy runner call models only with
# runner.ai or delivery.deployRunner.ai.
# ---------------------------------------------------------------------------------------------
ai:
  # -- The model registry, written into the servers' configuration as ai.models exactly as given,
  # so its keys are the configuration's own (snake_case): name, provider (anthropic, or openai for
  # any OpenAI-compatible server), endpoint, model, key: { store, key, field }, projects,
  # max_tokens, max_input_bytes, calls_per_run, tokens_per_day, price: { input_per_mtok,
  # output_per_mtok, ... }, timeout, effort, stream, headers, max_tokens_field, schema_mode.
  # A model's projects list is who may use it; empty: no project. The key is a secret reference,
  # looked up in the secret stores of whoever calls the model (runner.secretStores,
  # delivery.deployRunner.secretStores, or serverSecretStores below). Default (unset): none.
  # Example:
  #   - name: local
  #     provider: openai
  #     endpoint: http://ollama.ai.svc:11434/v1
  #     model: "qwen3:8b"
  #     projects: ["*"]
  #     schema_mode: json_object
  #   - name: claude
  #     provider: anthropic
  #     model: claude-sonnet-5-5
  #     key: { store: vault, key: ai/anthropic, field: key }
  #     projects: [shop]
  #     tokens_per_day: 2000000
  models: null
  # -- Secret stores the servers read model keys from, to explain failed steps themselves (the
  # same map as runner.secretStores); written as ai.secrets. Mount any token or certificate files
  # they refer to with server.extraVolumes/extraVolumeMounts. Default (unset): the servers explain
  # only with models that need no key.
  serverSecretStores: null
