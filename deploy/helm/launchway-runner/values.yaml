# Default values for the launchway-runner chart: Launchway runners only, connecting out to a
# Launchway server installed elsewhere (another namespace, another cluster, a VM). See
# deploy/README.md, "Connect a runner on another machine or cluster".
#
# Required: server.url, and token.existingSecret (build runners) or deployRunner.token.existingSecret
# (a deploy runner).
#
# The templates for the runners themselves (their file, the step namespace, the RBAC of the
# Kubernetes executor, the Deployments, the deploy runner's RBAC and admission policies) are the
# same as the launchway chart's: both charts copy them from deploy/helm/shared.

# -- Overrides the chart name in resource names.
nameOverride: ""
# -- Overrides the full resource name prefix (default: <release>-launchway-runner).
fullnameOverride: ""
# -- Labels added to every resource the chart creates.
commonLabels: {}

image:
  # -- The Launchway runner image (the same binary as the server's image; either works).
  repository: ghcr.io/jk-magic-creations/launchway-runner
  # -- The image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- An image digest (sha256:...). When set it is used instead of the tag.
  digest: ""
  pullPolicy: IfNotPresent

# -- Secrets for pulling the image, by name.
imagePullSecrets: []

server:
  # -- The Launchway server's URL, as the runners reach it (required). Runners make only
  # outbound connections, to this URL and to the Kubernetes API.
  url: ""

token:
  # -- A Secret in this namespace holding the runner token, or a runner pool's token, from the
  # server's administrator (required for build runners). The chart never creates it.
  existingSecret: ""
  existingSecretKey: token

# -- The original join-token setting, kept as an alias of runner.join. Use runner.join in new
# values files; setting both is refused.
join:
  existingSecret: ""
  existingSecretKey: join-token

# -- A proxy for the runners' connections (the server, Git, secret stores). Long polls last 25
# seconds: a proxy's idle timeout must be longer than 30 seconds. Put the Kubernetes API's address
# (and .svc, .cluster.local) in noProxy.
proxy:
  httpsProxy: ""
  httpProxy: ""
  noProxy: ""

# -- A CA bundle to trust instead of the image's, from a ConfigMap in this namespace, for a
# server behind a private CA or a proxy that inspects TLS. It replaces the system bundle
# (SSL_CERT_FILE, GIT_SSL_CAINFO), so it must also hold the public CAs you need.
caBundle:
  configMap: ""
  key: ca-bundle.pem

runner:
  # -- Run build runners (steps in pods of the step namespace). Turn off to run only a deploy
  # runner.
  enabled: true
  # -- Number of runner pods. A run whose runner is lost has its step run again by another.
  replicas: 2
  # -- Steps each runner executes at once.
  concurrency: 2
  # -- Enrol each runner pod with a join token instead of using the shared runner token: a Secret
  # holding a join token made in the UI (Runners, Add a runner) with enough uses for every pod
  # start, ideally ephemeral. Unset: token.existingSecret (or the original join.* alias above).
  #   join: { existingSecret: launchway-runner-join, existingSecretKey: token }
  join:
  # -- Labels the runners have, for pipelines that ask for them (runner: { labels }). Written
  # only when set. Unset: none.
  labels:
  # -- The runners' own limits on the work they take (accept: in runner.yaml), checked on the
  # runner before anything runs. Written only when set; see the server documentation. Unset: no
  # limits. For example:
  #   accept: { projects: [shop], images: ["registry.example.com/*"], pull_requests: false }
  accept:
  kubernetes:
    # -- The namespace step pods run in. Default: the release namespace. Runners are granted
    # access to pods in this namespace only. It must exist unless createNamespace is true.
    namespace: ""
    # -- Create the step namespace with the chart (deleted again on uninstall, with any step
    # pods in it).
    createNamespace: false
    # -- Labels for a namespace created by the chart. Step pods meet Pod Security "restricted"
    # unless runner.kubernetes.restricted is false; then use "baseline" here.
    namespaceLabels:
      pod-security.kubernetes.io/enforce: restricted
    # -- The image of each step pod's helper container, which holds the workspace. It needs sh
    # and tar. Default: docker.io/library/busybox:1.37.
    helperImage: ""
    # -- The ServiceAccount step pods run as, in the step namespace. Default: none, and no
    # token is mounted into step pods.
    serviceAccount: ""
    # -- Node selector for step pods (runner.nodeSelector is for the runner pods).
    nodeSelector: {}
    # -- CPU request of each container in a step pod, unless the pipeline asks for its own.
    # Default 50m.
    cpu: ""
    # -- Memory request of each container in a step pod, unless the pipeline asks for its own.
    # Default 64Mi.
    memory: ""
    # -- Memory limit of each container in a step pod that does not ask for memory. Default:
    # none.
    memoryLimit: ""
    # -- The most CPU one container of a step pod may ask for, as a request or a limit. The
    # server's step resource defaults are lowered to it; a step that asks for more fails before
    # its pod is made. Default: no cap.
    maxCpu: ""
    # -- The most memory one container of a step pod may ask for, as a request or a limit. The
    # server's step resource defaults are lowered to it; a step that asks for more fails before
    # its pod is made. Default: no cap.
    maxMemory: ""
    # -- Secrets in the step namespace for pulling step images, by name.
    imagePullSecrets: []
    # -- A grace period before a failed or canceled run's pod is removed (a Go duration such as
    # 10m). Default 0: the pod goes as soon as the run ends, because a running pod holds
    # namespace quota; a resume refills a new pod from the runner's checkout. See the runner
    # configuration reference, "What happens to a run's pod".
    keepFailed: ""
    # -- The longest any step pod lives, whatever the server says about its run, unless a step
    # of it is executing on that runner: the reaper's bound for pods that a crashed runner or a
    # forgotten run left behind. Default 24h; 0 turns the bound off.
    maxPodAge: ""
    # -- How long to wait for a step pod's images to be pulled and its containers to start.
    # Default 10m.
    startTimeout: ""
    # -- Run every container of a step pod, services included, as runAsUser/runAsGroup rather
    # than as its image's user, with no privilege escalation, no capabilities and the
    # RuntimeDefault seccomp profile, so step pods meet Pod Security "restricted". Each
    # container gets a writable HOME (/home/launchway) and /tmp. Steps that need root, such as
    # `apt-get install`, then fail: use images that already hold their tools. Set false to run
    # images as their own users (often root); the step namespace must then admit that (Pod
    # Security "baseline", see namespaceLabels). Pipelines cannot change this.
    restricted: true
    # -- The user step containers run as when restricted. Not 0 (root).
    # Unset: the built-in default, 1000.
    runAsUser:
    # -- The group step containers run as when restricted; it also owns the pod's volumes.
    # Unset: the built-in default, 1000.
    runAsGroup:
  # -- The port runners serve /healthz (process up) and /readyz (the server answered within two
  # minutes) on, for the probes below. It is not exposed outside the pod.
  healthPort: 8081
  livenessProbe:
    httpGet: { path: /healthz, port: health }
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # -- A runner that cannot reach the servers is not ready, which holds back a rollout that
  # would replace working runners with ones that cannot work.
  readinessProbe:
    httpGet: { path: /readyz, port: health }
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # -- Extra arguments for `launchway runner`. Flags override the settings in the rendered
  # file.
  extraArgs: []
  # -- Secret stores runners may read, the same map as runner.secrets in the server
  # configuration (see the main README); rendered into the runners' file. Mount any token or
  # certificate files they refer to with extraVolumes/extraVolumeMounts. Runners have only the
  # stores defined here: there is no "env" store unless you define one.
  secretStores: {}
  # -- Limits on the report files (test results) runners collect from a step pod after each
  # step. A step's log says when a file was cut short or left out.
  reports:
    # -- Files per step attempt.
    # Unset: the built-in default, 100.
    maxFiles:
    # -- MiB read of one file; a larger one is cut to this.
    # Unset: the built-in default, 10.
    maxFileMiB:
    # -- MiB read of all of a step attempt's files together (and at most what the servers
    # accept: config.tests.maxUploadMiB).
    # Unset: the built-in default, 20.
    maxTotalMiB:
  # -- Image steps (kind: image). Runners build images on BuildKit daemons you run apart from
  # the step pods (deploy/buildkit/buildkitd.yaml: rootless BuildKit cannot run under Pod
  # Security "restricted"), push them to the registries named here, and sign them. Unset (no
  # builders), runners take no image steps and the runners' file has no images section, so the
  # release before this one can read it. Set it only once every runner is upgraded.
  images:
    # -- The BuildKit daemons, each { name, address: tcp://host:1234, serverName, platforms,
    # projects }. The runners' client certificate and the daemons' CA come from tlsSecret.
    builders: []
    # -- A Secret with ca.crt (the CA that signed the daemons' certificates), tls.crt and
    # tls.key (the runners' client certificate), mounted at /var/run/launchway/buildkit.
    tlsSecret: ""
    # -- Registries by the name pipelines use: { host, credentials: { username, password: {
    # store, key, field } }, pullCredentials, caFile, insecure, push: [ { projects,
    # repositories } ], pullProjects: [ ... ] }. Credentials are secret references read from
    # runner.secretStores. pullCredentials go to the builds of the projects in pullProjects (empty:
    # every project), and to pull requests only when they may read secrets.
    # Mount a CA file with extraVolumes and name its path in caFile.
    registries: {}
    # -- A Secret with the runners' own cosign key (cosign.key, and cosign.password if it is
    # encrypted), for steps that say sign: true. Mounted at /var/run/launchway/signing, which
    # step pods never see. Unset: sign: true fails, saying the runner has no key.
    signingSecret: ""
    # -- The scanner image (pinned by digest) and where it downloads its databases from.
    # Unset: the built-in Trivy, from its public database repositories.
    scanner:
      image: ""
      dbRepository: ""
      javaDBRepository: ""
    # -- MiB of build context a step may send. Unset: the built-in default, 2048.
    maxContextMiB:
    # -- MiB of image the runner accepts back from a builder. Unset: the built-in default, 20480.
    maxImageMiB:
  # -- Let runners take ai steps. The servers must define ai.models; a model's key is read from
  # runner.secretStores. Written to the runners' file only when true. Unset: false.
  ai:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi
  # -- Runners clone each run's commit into this volume and copy it into the step pod.
  dataVolume:
    sizeLimit: 10Gi
  # -- Time allowed for a runner to stop. On SIGTERM it stops its steps (10s grace each) and
  # hands them back to be run again.
  terminationGracePeriodSeconds: 60
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- Spread runners across nodes when the scheduler can (soft).
  spreadAcrossNodes: true
  topologySpreadConstraints: []
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  serviceAccount:
    # -- Create the runners' ServiceAccount. It is bound to a Role in the step namespace.
    create: true
    # -- The name of the ServiceAccount to use (default: <fullname>).
    name: ""
    annotations: {}
  rbac:
    # -- Create the Role and RoleBinding that let runners manage step pods: pods (create, get,
    # list, delete, patch), pods/exec (create, get) and pods/log (get), in the step namespace
    # only.
    create: true

# Security settings of the runner pods. The image runs as user 65532.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# ---------------------------------------------------------------------------------------------
# NetworkPolicies, off by default (they need a network plugin that enforces them). See
# examples/networkpolicy.yaml.
# ---------------------------------------------------------------------------------------------
networkPolicy:
  enabled: false
  # -- DNS, allowed for runner and step pods.
  dns:
    enabled: true
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  # -- The Launchway server. With no cidrs and no namespaceSelector, any address on the port
  # (taken from server.url unless set) is allowed. Name the server's addresses, or, for a server
  # in this cluster, its namespace and pods.
  server:
    cidrs: []
    namespaceSelector: {}
    podSelector: {}
    port:
  # -- The Kubernetes API (build runners). With no cidrs, any address on these ports. The API
  # server is often not a pod, so use the addresses of `kubectl get endpoints kubernetes`.
  kubernetesAPI:
    cidrs: []
    ports: [443, 6443]
  # -- More egress rules for the runner pods (NetworkPolicyEgressRule objects): Git hosts,
  # secret stores, BuildKit daemons, registries the runners push to, Argo CD's repositories.
  extraEgress: []
  # -- A policy for the step namespace: no ingress, egress only DNS and these rules (package
  # registries and whatever the pipelines need).
  steps:
    enabled: false
    egress: []

# ---------------------------------------------------------------------------------------------
# Health sources for verify steps, using the same entries as delivery.verification.sources in the
# launchway chart. Register the same names, types and projects in the server's configuration;
# this chart gives their connection details only to the deploy runner.
# ---------------------------------------------------------------------------------------------
verification:
  sources: null

# ---------------------------------------------------------------------------------------------
# A deploy runner: does the work of deploy and rollback steps for one target cluster (Argo CD
# Applications, Argo Rollouts) and runs no scripts. The same values as delivery.deployRunner in
# the launchway chart, except the token, which here must be an existing Secret.
# ---------------------------------------------------------------------------------------------
deployRunner:
  # -- Run a deploy runner in this cluster, with the token of a deploy runner pool. It serves
  # deployRunner.target, which must be this cluster.
  enabled: false
  # -- The target this cluster is, as the server's environments name it (environments: in its
  # configuration, delivery.environments with the launchway chart).
  target: ""
  replicas: 1
  # -- Where the Argo CD Applications are.
  argocdNamespace: argocd
  # -- Which projects may deploy which applications. Names must be written out (no
  # patterns): the RBAC rules name each application.
  #   - { projects: [shop], names: [shop] }
  applications: []
  # -- Namespaces whose Argo Rollouts rollouts deploy steps may watch.
  rolloutNamespaces: []
  # -- GitOps repositories deploy steps may commit to, by name: the same map as deploy.repos
  # in a deploy runner's file (url, argocd_url, credentials, username, paths, author).
  # Credentials name a secret in secretStores, never a value.
  repos: {}
  # -- Secret stores the deploy runner may read (as runner.secretStores).
  secretStores: {}
  # -- Ask Argo CD to look at the repository at once after a commit (the refresh
  # annotation). Default (unset): true.
  refresh: null
  # -- Let the deploy runner call models configured on the servers to explain verification
  # verdicts, with keys read from deployRunner.secretStores. Written only when true. Unset: false.
  ai: null
  # -- The deploy runner's own limits on the work it takes (accept: in its runner.yaml), checked
  # on the runner before anything runs: which projects it serves and which environments it
  # deploys to. Written only when set. For example:
  #   accept: { projects: [launchway], environments: [launchway-dev, launchway-sandbox], executors: [deploy] }
  accept: null
  rbac:
    # -- Create the Roles below and bind them to the deploy runner.
    create: true
    # -- Grant patch on the named Applications, needed to request syncs and refreshes. With
    # automated sync and a Git webhook it may be turned off (deploy steps then need
    # sync.request: auto or never). The admission policy below limits what the patch may
    # change.
    patchApplications: true
    # -- Grant get on Deployments in the rollout namespaces, needed only for rollouts that
    # take their pod template from a Deployment (workloadRef). Off by default: a Deployment
    # holds its pod spec.
    readDeployments: false
    # -- Grant get and list on pods and get on pods/log in the rollout namespaces, so that the
    # run page can show the end of a failed analysis job's log and the pods of a rollout. Off
    # by default: logs can hold anything a job prints.
    readPods: false
    # -- Rollouts the deploy runner may promote, abort and retry (rollout steps, the run
    # page's buttons, abort_first, on_cancel: abort), by namespace; each namespace must be in
    # rolloutNamespaces. Grants patch on rollouts/status for exactly these names; the
    # admission policy keeps the patch to the fields those commands set. Default (unset):
    # none, and commands are not applied (the runner reports that it may not).
    #   shop: [shop]
    controlRollouts: null
  # -- A ValidatingAdmissionPolicy (Kubernetes 1.30 or newer) letting the deploy runner change
  # only an Application's operation and refresh annotation, never its spec.
  admissionPolicy:
    enabled: true
  # -- The deploy runner pool's token (runner_pools in the server's configuration, the pool
  # deploy-<target>): a Secret in this namespace. Required when enabled.
  token:
    existingSecret: ""
    existingSecretKey: token
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  healthPort: 8081
  nodeSelector: {}
  tolerations: []
  podAnnotations: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
