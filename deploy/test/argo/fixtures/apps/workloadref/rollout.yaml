# The workloadRef variant (Application demo-wref).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wref
  labels: { app.kubernetes.io/name: wref, app.kubernetes.io/part-of: launchway-test-argo }
spec:
  # The Rollout below owns the pods; this Deployment is only its template.
  replicas: 0
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 30
  selector:
    matchLabels: { app.kubernetes.io/name: wref }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wref }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: docker.io/library/busybox:1.36.1
          env:
            - name: MODE
              value: serve
          command:
            - sh
            - -c
            - |
              if [ "$MODE" = crash ]; then echo "MODE=crash: exiting"; exit 1; fi
              mkdir -p /tmp/www && echo "wref ok" > /tmp/www/index.html
              exec httpd -f -p 8080 -h /tmp/www
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 2
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
# A Rollout that takes its pod template from the Deployment above
# (spec.workloadRef) instead of carrying one.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: wref
  labels: { app.kubernetes.io/name: wref, app.kubernetes.io/part-of: launchway-test-argo }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 30
  progressDeadlineAbort: true
  selector:
    matchLabels: { app.kubernetes.io/name: wref }
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wref
    scaleDown: never
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: { duration: 5s }
        - setWeight: 100
