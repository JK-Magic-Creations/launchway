# The non-Rollout path: a plain Deployment of the same image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plain
  labels: { app.kubernetes.io/name: plain, app.kubernetes.io/part-of: launchway-test-argo }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 30
  selector:
    matchLabels: { app.kubernetes.io/name: plain }
  template:
    metadata:
      labels: { app.kubernetes.io/name: plain }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: docker.io/library/busybox:1.36.1
          env:
            - name: MODE
              value: serve
          command:
            - sh
            - -c
            - |
              if [ "$MODE" = crash ]; then echo "MODE=crash: exiting"; exit 1; fi
              mkdir -p /tmp/www && echo "plain ok" > /tmp/www/index.html
              exec httpd -f -p 8080 -h /tmp/www
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 2
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: plain
  labels: { app.kubernetes.io/name: plain, app.kubernetes.io/part-of: launchway-test-argo }
spec:
  selector: { app.kubernetes.io/name: plain }
  ports:
    - { name: http, port: 80, targetPort: http }
