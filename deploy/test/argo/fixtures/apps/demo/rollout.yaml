# The canary under test. Things a test changes with a one-line edit:
#   image tag        docker.io/library/busybox:1.36.1 <-> 1.37.0 (both serve HTTP)
#   MODE             "serve" (healthy) or "crash" (the container exits at once)
#   verdict          "pass" or "fail" (decides the analysis step)
#   delay            seconds the analysis runs before its verdict ("0")
#   pause            "{ duration: 5s }" or "{}" (an indefinite pause: waits for promote)
# A change to verdict, delay or pause alone does not start a new canary (the pod
# template is unchanged); combine it with an image or MODE change.
# No namespace here: the Application's destination sets it, so apps/manual can
# be a byte-for-byte copy.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo
  labels: { app.kubernetes.io/name: demo, app.kubernetes.io/part-of: launchway-test-argo }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  # A crash-looping canary never becomes ready; after this many seconds without
  # progress the Rollout is aborted and goes Degraded.
  progressDeadlineSeconds: 30
  progressDeadlineAbort: true
  selector:
    matchLabels: { app.kubernetes.io/name: demo }
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: { duration: 5s }
        - analysis:
            templates:
              - templateName: demo-verdict
            args:
              - name: verdict
                value: "pass"
              - name: delay
                value: "0"
        - setWeight: 100
  template:
    metadata:
      labels: { app.kubernetes.io/name: demo }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: docker.io/library/busybox:1.36.1
          env:
            - name: MODE
              value: serve
          command:
            - sh
            - -c
            - |
              if [ "$MODE" = crash ]; then echo "MODE=crash: exiting"; exit 1; fi
              mkdir -p /tmp/www && echo "demo ok" > /tmp/www/index.html
              exec httpd -f -p 8080 -h /tmp/www
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 2
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
