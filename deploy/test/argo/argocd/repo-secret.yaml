# Lets Argo CD read the private test repository. Test-only credentials (the
# same as lw-git/git-credentials).
apiVersion: v1
kind: Secret
metadata:
  name: repo-lw-gitops
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
    app.kubernetes.io/part-of: launchway-test-argo
type: Opaque
stringData:
  type: git
  url: http://git.lw-git.svc:8080/lwtest/gitops.git
  username: lwtest
  password: lwtest-not-a-secret
