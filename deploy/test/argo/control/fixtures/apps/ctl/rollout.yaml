# The canary the control tests drive (deploy/test/argo/control). Its first pause has no
# duration: the rollout waits there until something promotes it. One-line edits:
#   image tag   docker.io/library/busybox:1.36.1 <-> 1.37.0 (both serve HTTP)
#   REV         any value: a new pod template without a new image
#   verdict     "pass" or "fail" (decides the analysis step)
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ctl
  labels: { app.kubernetes.io/name: ctl, app.kubernetes.io/part-of: launchway-test-argo-control }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 120
  selector:
    matchLabels: { app.kubernetes.io/name: ctl }
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: {}
        - analysis:
            templates:
              - templateName: ctl-verdict
            args:
              - name: verdict
                value: "pass"
        - setWeight: 100
  template:
    metadata:
      labels: { app.kubernetes.io/name: ctl }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: docker.io/library/busybox:1.36.1
          env:
            - name: REV
              value: "0"
          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/www && echo "ctl $REV" > /tmp/www/index.html
              exec httpd -f -p 8080 -h /tmp/www
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 2
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
