# TEST ONLY: values for trying the chart on a kind cluster with an image loaded into it.
externalURL: http://launchway.test
image:
  repository: localhost/launchway
  tag: 0.0.0-k8stest
  pullPolicy: Never

# The bundled single database (the default).
postgresql:
  enabled: true

config:
  # No sign-in in this throwaway cluster; the servers refuse to listen on 0.0.0.0 without this.
  extraConfig:
    auth:
      mode: none
      allow_anonymous: true
  projects:
    # Served by git-server.yaml in the release namespace.
    - name: demo
      repo: http://git-server:8080/demo.git
      branch: main
      poll: 10s

runner:
  kubernetes:
    # Step pods run in a namespace of their own, which the chart creates.
    namespace: lw-pkg-steps
    createNamespace: true
