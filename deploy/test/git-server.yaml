# TEST ONLY. Serves the repository made by make-test-repo.sh over Git's "dumb" HTTP protocol
# (static files), at http://git-server:8080/demo.git in the namespace it is applied to.
# Needs a ConfigMap called demo-repo holding demo-repo.tar.gz:
#   kubectl create configmap demo-repo --from-file=demo-repo.tar.gz
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  labels: { app.kubernetes.io/name: git-server, app.kubernetes.io/part-of: launchway-test }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: git-server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: git-server, app.kubernetes.io/part-of: launchway-test }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: unpack
          image: docker.io/library/busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ["tar", "-xzf", "/repo/demo-repo.tar.gz", "-C", "/srv"]
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: repo, mountPath: /repo, readOnly: true }
            - { name: srv, mountPath: /srv }
      containers:
        - name: httpd
          image: docker.io/library/busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/srv"]
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /demo.git/HEAD, port: http }
            periodSeconds: 2
          securityContext: *restricted
          volumeMounts:
            - { name: srv, mountPath: /srv, readOnly: true }
      volumes:
        - name: repo
          configMap: { name: demo-repo }
        - name: srv
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  labels: { app.kubernetes.io/name: git-server, app.kubernetes.io/part-of: launchway-test }
spec:
  selector: { app.kubernetes.io/name: git-server }
  ports:
    - { name: http, port: 8080, targetPort: http }
