# A drop-in for launchway-runner.service when the runner uses the container executor with rootless
# Podman (executor: podman or container in /etc/launchway/runner.yaml). install.sh --executor podman
# installs it; with the packages, copy it:
#
#   install -D -m 0644 /usr/share/launchway/systemd/container-executor.conf \
#       /etc/systemd/system/launchway-runner.service.d/container-executor.conf
#   systemctl daemon-reload && systemctl restart launchway-runner
#
# Rootless Podman runs each step in a user namespace of the runner user's own, which the default
# sandbox forbids. What it needs, and why:
[Service]
# newuidmap and newgidmap are setuid (or file-capability) helpers that map the runner user's
# subordinate ids (/etc/subuid, /etc/subgid) into the namespace. They need privileges the runner
# does not have, so the runner must be allowed to gain them through those helpers.
NoNewPrivileges=no
RestrictSUIDSGID=no
CapabilityBoundingSet=CAP_SETUID CAP_SETGID
# Steps' containers live in user, mount, network, PID and other namespaces.
RestrictNamespaces=no
# Podman uses /dev/fuse (fuse-overlayfs) and /dev/net/tun (pasta or slirp4netns).
PrivateDevices=no
# Podman's cgroup handling and conmon need to see and manage the service's cgroup.
ProtectControlGroups=no
Delegate=yes
# Podman keeps its runtime state in XDG_RUNTIME_DIR. ProtectSystem=strict leaves /run read-only,
# so the service gets a runtime directory of its own instead of /run/user/<uid> (no lingering
# session needed).
RuntimeDirectory=launchway-runner
RuntimeDirectoryMode=0700
Environment=XDG_RUNTIME_DIR=/run/launchway-runner
ProtectProc=default
RemoveIPC=no
# The runner user also needs subordinate ids: install.sh adds a range to /etc/subuid and
# /etc/subgid if it has none (usermod --add-subuids ... --add-subgids ...).
