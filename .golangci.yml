# golangci-lint configuration (v2). Run with `make lint`.
#
# Findings that existed when the gates were introduced are recorded in
# quality/lint-baseline.json and tolerated; any finding beyond that baseline
# fails the build. See docs/development/quality-gates.md.
version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - bodyclose
    - contextcheck
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - revive
    - gocyclo
    - funlen
    - dupl
    - misspell
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable-all: false
    gocyclo:
      min-complexity: 30
    funlen:
      lines: 150
      statements: 100
    dupl:
      threshold: 200
    gosec:
      excludes:
        - G104   # covered by errcheck
        - G304   # file paths come from configuration, not requests
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    paths:
      - node_modules
    presets:
      - comments
      - std-error-handling
    rules:
      # Tests may be long, repetitive and sloppy about cleanup errors.
      - path: _test\.go
        linters: [funlen, dupl, gocyclo, gosec, errcheck, bodyclose, noctx, contextcheck, revive]
      # The quality tools are small command-line programs that read and write
      # files named on their command line.
      - path: ^scripts/
        linters: [gosec]

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
