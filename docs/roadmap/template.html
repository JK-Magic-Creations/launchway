<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launchway roadmap</title>
<meta name="description" content="What Launchway does today and what is planned, in milestones marked Now, Next and Later.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f5bd3'/%3E%3Cpath d='M14 46 L32 14 L50 46' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M22 46 H42' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<!--
  Generated by scripts/docs/build-roadmap.mjs from docs/roadmap/template.html and
  docs/roadmap/roadmap.json. Edit those, not docs/public/roadmap.html.
-->
<script>
  // Light or dark: the docs site's choice if there is one, else the system's.
  (function () {
    var t = null
    try { t = localStorage.getItem('vitepress-theme-appearance') } catch (e) {}
    var q = /[?&]theme=(light|dark)/.exec(location.search); if (q) t = q[1]
    var dark = t === 'dark' || ((!t || t === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.dataset.theme = dark ? 'dark' : 'light'
  })()
</script>
<style>
:root {
  --bg: #ffffff; --bg-soft: #f6f6f7; --bg-card: #ffffff; --text: #1f2328; --text-2: #4b5563; --line: #e2e2e3;
  --brand: #2f5bd3; --brand-soft: rgba(47, 91, 211, .09);
  --ok: #17703f; --ok-soft: rgba(23, 112, 63, .1); --wip: #a14d00; --wip-soft: rgba(196, 98, 0, .1);
  --plan: #55607a; --plan-soft: rgba(91, 98, 112, .1); --focus: #2f5bd3;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1b1b1f; --bg-soft: #202127; --bg-card: #23242a; --text: #e8e8ea; --text-2: #a8abb4; --line: #34353c;
  --brand: #8aa8ff; --brand-soft: rgba(138, 168, 255, .13);
  --ok: #5fd08f; --ok-soft: rgba(95, 208, 143, .12); --wip: #f2a65a; --wip-soft: rgba(242, 166, 90, .12);
  --plan: #b4b8c2; --plan-soft: rgba(180, 184, 194, .12); --focus: #8aa8ff;
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 16px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--brand); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--bg-card); padding: 8px 12px; z-index: 9; }
.skip:focus { left: 8px; }
header.top { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
header.top .home { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 600; }
header.top .spacer { flex: 1; }
header.top nav a { color: var(--text-2); text-decoration: none; font-size: 14px; margin-left: 16px; }
header.top nav a:hover { color: var(--brand); }
.toggle { border: 1px solid var(--line); background: var(--bg-soft); color: var(--text); border-radius: 18px; padding: 5px 12px; font: inherit; font-size: 14px; cursor: pointer; }
main { max-width: 1120px; margin: 0 auto; padding: 40px 24px 72px; }
.eyebrow { margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
h1 { font-size: 44px; line-height: 1.1; margin: 0 0 20px; letter-spacing: -.025em; }
.vision { list-style: none; counter-reset: v; margin: 0 0 18px; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.vision li { counter-increment: v; position: relative; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px 18px; font-size: 16.5px; line-height: 1.5; }
.vision li::before { content: counter(v); display: block; width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-bottom: 10px; }
:root[data-theme="dark"] .vision li::before { color: #14161c; }
.asof { color: var(--text-2); font-size: 15px; margin: 0 0 24px; max-width: 820px; }
.stats { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 28px; }
.stat { display: flex; align-items: center; gap: 12px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 18px; box-shadow: var(--shadow); }
.stat b { font-size: 30px; line-height: 1; letter-spacing: -.02em; }
.stat.st-available b { color: var(--ok); } .stat.st-in-progress b { color: var(--wip); } .stat.st-planned b { color: var(--plan); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 10px; border: 1px solid currentColor; line-height: 1.6; white-space: nowrap; }
.chip.st-available { color: var(--ok); background: var(--ok-soft); }
.chip.st-in-progress { color: var(--wip); background: var(--wip-soft); }
.chip.st-planned { color: var(--plan); background: var(--plan-soft); border-style: dashed; }

/* The journey: one station per milestone */
.journey { list-style: none; margin: 0 0 36px; padding: 0; display: grid; grid-template-columns: repeat(9, 1fr); gap: 0; position: relative; }
.journey::before { content: ""; position: absolute; left: 5.5%; right: 5.5%; top: 24px; height: 3px; background: linear-gradient(90deg, var(--ok) 0 11%, var(--wip) 11% 22%, var(--line) 22%); border-radius: 2px; }
.journey li { position: relative; text-align: center; min-width: 0; }
.journey a { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: var(--text); padding: 0 4px; border-radius: 10px; }
.journey a:hover .jname { color: var(--brand); }
.node { position: relative; z-index: 1; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 18px; background: var(--bg); box-shadow: 0 0 0 4px var(--bg); border: 3px solid var(--plan); color: var(--plan); margin-bottom: 6px; }
.when-now .node { border-color: var(--wip); color: var(--wip); background: var(--bg); background-image: linear-gradient(var(--wip-soft), var(--wip-soft)); }
.when-next .node { border-color: var(--brand); color: var(--brand); }
.when-later .node { border-style: dashed; }
.node-a { border-color: var(--ok); color: var(--ok); background-image: linear-gradient(var(--ok-soft), var(--ok-soft)); }
.jname { font-size: 13.5px; font-weight: 600; line-height: 1.25; }
.jwhen { font-size: 12px; color: var(--text-2); }
.journey .bar { width: 72%; margin-top: 5px; height: 6px; }

.bar { display: flex; gap: 2px; height: 8px; min-width: 60px; border-radius: 4px; overflow: hidden; background: var(--line); }
.seg { display: block; height: 100%; }
.seg.st-available { background: var(--ok); } .seg.st-in-progress { background: var(--wip); } .seg.st-planned { background: var(--plan); opacity: .45; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 0 8px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip { border: 1px solid var(--line); background: var(--bg-card); color: var(--text); border-radius: 16px; padding: 4px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.fchip[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
.search { flex: 1 1 200px; min-width: 0; max-width: 320px; border: 1px solid var(--line); background: var(--bg-card); color: var(--text); border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 15px; }
.count { color: var(--text-2); font-size: 14px; margin: 0; flex: 1 0 100%; min-height: 1.4em; }

.st-section, .milestone, .principles { margin-top: 44px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 4px; }
.sec-head h2 { font-size: 26px; margin: 0; letter-spacing: -.015em; }
.sec-note { color: var(--text-2); font-size: 15px; }
.theme-h { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); margin: 22px 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; list-style: none; padding: 0; margin: 0; }
.st-available .grid, #available .grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card { background: var(--bg-card); border: 1px solid var(--line); border-left-width: 4px; border-radius: 12px; padding: 12px 16px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
.card.st-available { border-left-color: var(--ok); }
.card.st-in-progress { border-left-color: var(--wip); }
.card.st-planned { border-left-color: var(--plan); border-left-style: dashed; }
.principles .card { border-left-color: var(--brand); }
.card .chip { align-self: flex-start; margin-bottom: 2px; }
.card h4 { margin: 0; font-size: 16.5px; line-height: 1.35; }
.card h4 a { color: var(--text); text-decoration: none; }
.card h4 a::after { content: " →"; color: var(--brand); }
.card h4 a:hover { color: var(--brand); text-decoration: underline; }
.card p { margin: 0; color: var(--text-2); font-size: 15px; line-height: 1.5; }
.more { white-space: nowrap; font-weight: 600; font-size: 14px; text-decoration: none; }
.more:hover { text-decoration: underline; }

.milestone { border-top: 1px solid var(--line); padding-top: 32px; }
.m-head { display: grid; grid-template-columns: 64px 1fr minmax(220px, 280px); gap: 6px 20px; align-items: start; }
.mnum { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; font-weight: 800; background: var(--plan-soft); color: var(--plan); border: 2px dashed var(--plan); }
.when-now .mnum { background: var(--wip-soft); color: var(--wip); border: 2px solid var(--wip); }
.when-next .mnum { background: var(--brand-soft); color: var(--brand); border: 2px solid var(--brand); }
.m-title h2 { font-size: 26px; line-height: 1.2; margin: 2px 0 6px; letter-spacing: -.015em; }
.when { margin: 0; font-size: 13px; color: var(--text-2); font-weight: 600; }
.when-chip { display: inline-block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 0 9px; border-radius: 8px; margin-right: 4px; background: var(--plan-soft); color: var(--plan); }
.when-chip.when-now { background: var(--wip-soft); color: var(--wip); }
.when-chip.when-next { background: var(--brand-soft); color: var(--brand); }
.promise { margin: 0; color: var(--text-2); font-size: 17px; max-width: 720px; }
.m-progress { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
.m-count { font-size: 13px; color: var(--text-2); }
.empty { color: var(--text-2); font-style: italic; }
[hidden] { display: none !important; }
mark { background: var(--brand-soft); color: inherit; border-radius: 3px; }
footer { border-top: 1px solid var(--line); margin-top: 56px; padding-top: 16px; color: var(--text-2); font-size: 14px; max-width: 820px; }
noscript div { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; background: var(--bg-soft); }

@media (max-width: 960px) {
  .vision { grid-template-columns: 1fr; }
  .m-head { grid-template-columns: 56px 1fr; }
  .m-progress { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  .journey { grid-template-columns: 1fr; gap: 4px; padding-left: 4px; }
  .journey::before { left: 27px; right: auto; top: 24px; bottom: 24px; width: 3px; height: auto; background: var(--line); }
  .journey a { flex-direction: row; align-items: center; gap: 12px; text-align: left; padding: 4px 0; }
  .journey .node { width: 40px; height: 40px; font-size: 16px; margin: 0; flex: none; }
  .journey .jname { flex: 1; font-size: 15px; }
  .journey .jwhen { width: 64px; text-align: right; }
  .journey .bar { width: 64px; margin: 0; flex: none; }
  .journey li:first-child .jwhen { width: auto; }
}
@media (max-width: 640px) {
  header.top { padding: 12px 16px; flex-wrap: wrap; }
  header.top nav { order: 3; width: 100%; }
  header.top nav a { margin: 0 14px 0 0; }
  main { padding: 24px 16px 56px; }
  h1 { font-size: 32px; }
  .grid { grid-template-columns: 1fr; }
  .m-title h2, .sec-head h2 { font-size: 22px; }
  .m-head { grid-template-columns: 44px 1fr; gap: 6px 14px; }
  .mnum { width: 44px; height: 44px; font-size: 20px; border-radius: 12px; }
  .stat { padding: 8px 12px; }
  .stat b { font-size: 24px; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s, transform .15s; } .card:hover { border-color: var(--brand); transform: translateY(-1px); } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<a class="skip" href="#content">Skip to the roadmap</a>
<header class="top">
  <a class="home" href="./index.html" aria-label="Launchway documentation home">
    <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#2f5bd3"/><path d="M14 46 L32 14 L50 46" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 46 H42" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="34" r="4" fill="#fff"/></svg>
    Launchway
  </a>
  <span class="spacer"></span>
  <nav aria-label="Documentation">
    <a href="./start/overview.html">Docs</a>
    <a href="./roadmap-list.html">Roadmap as a list</a>
    <a href="https://github.com/JK-Magic-Creations/launchway">GitHub</a>
  </nav>
  <button class="toggle" id="toggle" type="button" aria-label="Switch between light and dark">Dark</button>
</header>
/*ROADMAP_BODY*/
<script>
(function () {
  var root = document.documentElement
  var toggle = document.getElementById('toggle')
  function showToggle() { toggle.textContent = root.dataset.theme === 'dark' ? 'Light' : 'Dark' }
  showToggle()
  toggle.addEventListener('click', function () {
    var next = root.dataset.theme === 'dark' ? 'light' : 'dark'
    root.dataset.theme = next
    try { localStorage.setItem('vitepress-theme-appearance', next) } catch (e) {}
    showToggle()
  })

  // Filtering is an extra: the page reads whole without it, so the controls show only here.
  var controls = document.getElementById('controls')
  controls.hidden = false
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card[data-status]'))
  var state = { f: '', q: '' }
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }
  function draw() {
    var shown = 0
    cards.forEach(function (c, n) {
      var text = c.textContent.toLowerCase()
      var ok = (!state.f || c.dataset.status === state.f) && (!state.q || text.indexOf(state.q) >= 0)
      c.hidden = !ok
      if (ok) shown++
    })
    Array.prototype.forEach.call(document.querySelectorAll('.subgroup, .st-section'), function (g) {
      g.hidden = !g.querySelector('.card[data-status]:not([hidden])')
    })
    Array.prototype.forEach.call(document.querySelectorAll('.milestone'), function (m) {
      m.hidden = !m.querySelector('.card[data-status]:not([hidden])')
    })
    document.getElementById('count').textContent = (state.f || state.q) ? shown + ' of ' + cards.length + ' items shown' : ''
  }
  Array.prototype.forEach.call(document.querySelectorAll('.fchip'), function (b) {
    b.addEventListener('click', function () {
      state.f = b.dataset.f
      Array.prototype.forEach.call(document.querySelectorAll('.fchip'), function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false') })
      draw()
    })
  })
  document.getElementById('q').addEventListener('input', function (e) { state.q = e.target.value.trim().toLowerCase(); draw() })
})()
</script>
</body>
</html>
