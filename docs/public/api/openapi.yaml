# Generated from the route table and docs/reference/http-api.md by internal/api/openapi_test.go; do not edit.
# LAUNCHWAY_UPDATE_DOCS=1 go test ./internal/api -run TestOpenAPI rewrites it.
components:
    parameters:
        Csrf:
            description: 'Required on a change made with a session cookie (not with a bearer token): it says the request came from Launchway''s own pages, which a page of another site cannot send.'
            in: header
            name: X-Launchway-CSRF
            required: false
            schema:
                enum:
                    - "1"
                type: string
        IdempotencyKey:
            description: A repeated call with the same key answers with the run the first call started.
            in: header
            name: Idempotency-Key
            required: false
            schema:
                maxLength: 200
                type: string
    responses:
        Error:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Something went wrong. The body says what, in plain words, with a code a program can branch on and what to do next.
            headers:
                Retry-After:
                    description: Seconds to wait before trying again (429 and 503).
                    schema:
                        type: integer
    schemas:
        Error:
            properties:
                code:
                    description: 'A stable lower-case word for programs: bad_request, unauthorized, forbidden, not_found, conflict, invalid, rate_limited, internal, unavailable and others a route may add.'
                    type: string
                error:
                    description: What went wrong, in a plain sentence.
                    type: string
                fields:
                    additionalProperties:
                        type: string
                    description: 'For input values that do not fit: the message for each field by name.'
                    type: object
                next:
                    description: What to do about it.
                    type: string
                problems:
                    description: 'For a pipeline or configuration that is not valid: each problem with its file, line, path and message.'
                    items:
                        type: object
                    type: array
            required:
                - error
                - code
                - next
            type: object
    securitySchemes:
        bearerToken:
            description: 'An API token made under People and access, sent as Authorization: Bearer.'
            scheme: bearer
            type: http
        runnerToken:
            description: A runner's token or identity, for /api/runner only.
            scheme: bearer
            type: http
        sessionCookie:
            description: The session a person gets by signing in to the web interface.
            in: cookie
            name: launchway_session
            type: apiKey
info:
    description: 'The API the web interface, the command line and the MCP server use. Every route is listed, with who may call it and what it records in the audit trail. Errors have one shape (error, code, next). Times are Unix milliseconds. Lists that can be long take limit and a cursor or before value and say where the next page starts. A breaking change gets a new version prefix (/api/v2); within v1 fields are added, never removed or retyped. Rate limits: failed authentication, sign-in checks and MCP calls are limited per caller and answer 429 with Retry-After; no other rate-limit headers are sent. Idempotency: a webhook call with an Idempotency-Key answers with the run the first call started.'
    license:
        identifier: AGPL-3.0-only
        name: AGPL-3.0-only
    title: Launchway HTTP API
    version: v1
openapi: 3.1.0
