            description: '{"connection", "urls", "owner", "repository", "target_owner", "mirror" (default true), "interval_seconds", "username", "dry_run", "wait"}. owner limits the listing to one user or Wing of the source, repository (owner/name) to one; without them it brings in everything the credential can see. dry_run lists what would be created and changes nothing. wait copies and checks each repository before answering; without it the repositories are made and their mirrors left to run in the background. mirror: false makes each an ordinary repository once copied and checked (needs wait). Answers {"dry_run", "items", "summary"}; each item has source, repository, url, visibility, action (create, resume, skip), state (planned, queued, verified, skipped, failed), reason, error (credentials removed), source_refs, hosted_refs, verified, differences and mirror_id. One repository failing does not stop the others.'
