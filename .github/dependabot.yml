# Dependency update pull requests, weekly: Go modules, the web UI and docs tools (npm), the
# Dockerfile's base images, and the pinned GitHub Actions. Security updates also arrive as alerts.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: weekly }
    groups:
      docs-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
