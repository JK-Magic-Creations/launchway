name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless: it is cancelled. Runs on main
# are kept, one per commit, so every commit has its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The whole suite exactly as the project's own pipeline runs it (.launchway/pipeline.yaml, step
  # `test`; `make test-like-ci`): no race detector, the same flags, the same per-package timeout. This
  # is the job whose result is comparable with the in-cluster one, and the one that asserts every
  # timing limit (the scale and speed tests) at full strictness.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Build the documentation into the binary (the Learn area)
        run: make learn
      - name: Vet and test (SQLite, no race detector, as the pipeline runs it)
        run: |
          go vet ./...
          go test -count=1 -timeout 28m ./...
      - name: Build the binary
        run: CGO_ENABLED=0 go build -trimpath -o bin/launchway ./cmd/launchway

  # The same code under the race detector, in groups that run side by side, each with its own job
  # timeout and its own go test -timeout, so no single job needs more than about 20 minutes (the
  # packages of the longest ones, internal/api and internal/engine, are split by test name). They run
  # with -short: the tests that are long end-to-end runs or scale tests (listed in
  # docs/development/quality-gates.md, "Timing tests and the race detector") skip themselves, and the
  # job above runs every one of them. A test that asserts a wall-clock limit scales it under the
  # detector (internal/testlib.Slow) or does not assert it (testlib.SkipTimingUnderRace).
  race:
    name: race (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # GROUP[:SHARD/SHARDS], see scripts/ci/race-group.sh. api, engine and storage are one package each,
        # split by test name; rest is every package no other group names, split by package.
        group: ["api:1/4", "api:2/4", "api:3/4", "api:4/4", "engine:1/4", "engine:2/4", "engine:3/4", "engine:4/4", "storage:1/2", "storage:2/2", "forge", "rest:1/2", "rest:2/2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Build the documentation into the binary (the Learn area)
        run: make learn
      - name: Test under the race detector (${{ matrix.group }})
        env:
          GROUP: ${{ matrix.group }}
        run: scripts/ci/race-group.sh "$GROUP"

  # The packages that can run on PostgreSQL as well as SQLite, against a real server, without the race
  # detector and without -short. On PostgreSQL every test makes its own database, and one job running
  # internal/engine or internal/api took more than 20 minutes, so each is split by test name
  # (scripts/ci/race-group.sh, MODE=plain). The timeouts are 20 minutes per go test and 30 per job, and
  # the shard counts are an estimate from the first run; each job logs its time, rebalance from that.
  postgres:
    name: postgres (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ["source", "engine:1/4", "engine:2/4", "engine:3/4", "engine:4/4", "api:1/5", "api:2/5", "api:3/5", "api:4/5", "api:5/5"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: launchway
          POSTGRES_PASSWORD: launchway
          POSTGRES_DB: launchway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U launchway" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Build the documentation into the binary (the Learn area)
        run: make learn
      - name: Test with several servers (PostgreSQL, no race detector)
        env:
          GROUP: ${{ matrix.group }}
          MODE: plain
          LAUNCHWAY_TEST_POSTGRES: postgres://launchway:launchway@127.0.0.1:5432/launchway?sslmode=disable
        run: scripts/ci/race-group.sh "$GROUP"

  # Real containers: the executor against the container runtime the runner has.
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Test with real containers
        env:
          LAUNCHWAY_TEST_CONTAINERS: "1"
        run: go test -count=1 -timeout 30m ./internal/executor/

  # Supply chain: known vulnerabilities in the code's dependencies (govulncheck), their licenses,
  # the packaging scripts (shellcheck), the workflows (actionlint), both Helm charts, and a
  # reproducible release build (built twice, compared byte for byte; nothing is signed or
  # published).
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Tools
        run: make tools
      - name: Vulnerabilities (govulncheck)
        run: make vulncheck
      - name: Licenses of dependencies
        run: make license-check
      - name: Scripts and workflows
        run: make lint-scripts lint-workflows
      - name: Charts
        run: make chart-lint
      - name: Reproducible release build
        run: make release-reproduce
