# Builds the documentation site and checks links, anchors, spelling and the
# roadmap on pull requests. Publishing is done by docs-pages.yml.
name: Docs
on:
  pull_request:
    paths: ["docs/**", "scripts/docs/**", "internal/**", "cmd/**", "deploy/helm/**", "Makefile", ".github/workflows/docs*.yml"]

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless: it is cancelled. Runs on main
# are kept, one per commit, so every commit has its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build and check the site
        run: make docs
      - name: Render every diagram, light and dark
        run: |
          cd docs && npx playwright-core install --with-deps chromium && cd ..
          make docs-diagrams
      - name: Check the reference pages against the code
        run: |
          make docs-reference
