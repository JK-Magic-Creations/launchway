# Blank issues are off: a form gives the maintainer what is needed to act on a report.
blank_issues_enabled: false
contact_links:
  - name: Report a security problem (private)
    url: https://github.com/JK-Magic-Creations/launchway/security/advisories/new
    about: Do not open a public issue for a vulnerability. Use GitHub's private vulnerability reporting; SECURITY.md says what happens next.
  - name: Ask a question or share an idea
    url: https://github.com/JK-Magic-Creations/launchway/discussions
    about: How do I...?, is this expected?, design ideas. Discussions keeps issues for work that can be done.
