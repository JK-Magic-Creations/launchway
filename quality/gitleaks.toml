# gitleaks configuration: the default rules, plus a few paths that hold deliberate fake secrets.
# Everything else is a finding. Known old findings are in quality/gitleaks-baseline.json, which may
# only shrink.
[extend]
useDefault = true

[allowlist]
description = "files that are not source (lock files, compiled output), the architecture test table, and test canaries"
paths = [
  '''web/package-lock\.json''',
  '''docs/package-lock\.json''',
  '''go\.sum''',
  '''web/dist/''',
  # The import table of the architecture test: package paths only. Its long lines trip the
  # generic-api-key rule, and every commit that moves a line makes a new fingerprint, so a baseline
  # entry per commit could never keep up. No value in it is a secret.
  '''internal/archtest/arch_test\.go''',
  # Two tests that plant secret-shaped fake values to prove they are masked or refused: the Ansible report
  # test (values built from parts now; its first commits wrote them whole) and the starters' own test script
  # (a private key header written to a file in a throwaway repository). Nothing in them is a secret.
  '''internal/cac/ansible/report_test\.go''',
  '''internal/starters/library/tests/run\.sh''',
  # The deploy runner's own HTTP and TCP checks: a fake token in a test, its fixture and the example file shows (they came
  # in with the verify work, before the baseline was last made).
  '''internal/verify/source/check_test\.go''',
  '''internal/deploy/inspect/''',
  '''deploy/helm/launchway-runner/examples/deploy-runner-inspect\.yaml''',
]
# Test canaries are fake by construction: the tests plant a value that starts with CANARY- to prove
# it appears nowhere in output. A real secret never starts that way.
regexes = [
  '''^CANARY-[A-Za-z0-9-]+$''',
]
